<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TULPAR TAXI — Әкімші</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--yellow:#ffcc00;--green:#16bd79;--red:#e34b59;--card:#1c2536;--border:#2e3a52;--text-muted:#94a3b8}
body{margin:0;background:#101522;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#101114 0%,#1a1d24 100%);padding:16px;text-align:center;border-bottom:3px solid var(--yellow);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
header h1{margin:0;color:var(--yellow);font-size:20px;font-weight:900}
header .subtitle{color:var(--text-muted);font-size:12px;margin-top:3px;font-weight:500}
.logout-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.15);padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
main{max-width:850px;margin:auto;padding:14px}
.login-panel{max-width:420px;margin:70px auto;background:var(--card);border-radius:20px;padding:32px 24px;border:1px solid var(--border);box-shadow:0 10px 40px rgba(0,0,0,0.3);text-align:center}
.login-panel h2{color:var(--yellow);margin:0 0 8px;font-size:22px;font-weight:900}
.login-panel p{color:var(--text-muted);font-size:13px;margin:0 0 24px}
.login-icon{font-size:56px;margin-bottom:12px;display:block}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.card h2{margin:0 0 14px;color:var(--yellow);font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
input,select,textarea{width:100%;padding:14px;margin:6px 0;border:1.5px solid var(--border);border-radius:12px;background:#111a2a;color:white;font-size:14px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--yellow)}
textarea{min-height:100px;resize:vertical}
button{font-family:inherit;border:0;cursor:pointer;transition:transform 0.15s,opacity 0.2s}
button:active:not(:disabled){transform:scale(0.97)}
button:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#ffcc00 0%,#ffdb4d 100%);color:#111;padding:14px;border-radius:12px;font-weight:800;font-size:14px;width:100%;margin-top:8px}
.btn-refresh{background:linear-gradient(135deg,#2d3a52 0%,#3a4a66 100%);color:white;padding:13px 18px;border-radius:12px;font-weight:700;font-size:13px;margin-bottom:14px}
.btn-approve{background:linear-gradient(135deg,#16bd79 0%,#19d995 100%);color:white;padding:11px 16px;border-radius:10px;font-weight:800;font-size:13px;margin-right:8px;margin-top:8px}
.btn-reject{background:linear-gradient(135deg,#e34b59 0%,#f05a68 100%);color:white;padding:11px 16px;border-radius:10px;font-weight:800;font-size:13px;margin-top:8px}
.btn-block{background:linear-gradient(135deg,#e34b59 0%,#f05a68 100%);color:white;padding:9px 14px;border-radius:9px;font-weight:700;font-size:12px;margin-right:6px;margin-top:6px}
.btn-unblock{background:linear-gradient(135deg,#16bd79 0%,#19d995 100%);color:white;padding:9px 14px;border-radius:9px;font-weight:700;font-size:12px;margin-right:6px;margin-top:6px}
.btn-delete{background:linear-gradient(135deg,#991b1b 0%,#b91c1c 100%);color:white;padding:9px 14px;border-radius:9px;font-weight:700;font-size:12px;margin-top:6px}
.btn-send{background:linear-gradient(135deg,#ffcc00 0%,#ffdb4d 100%);color:#111;padding:12px 18px;border-radius:11px;font-weight:800;font-size:14px}
.application{background:linear-gradient(135deg,#243045 0%,#2a3650 100%);padding:16px;border-radius:14px;margin:12px 0;border:1px solid rgba(255,255,255,0.06)}
.application h3{color:var(--yellow);font-size:15px;font-weight:800;margin:0 0 10px}
.application .details{line-height:1.8;color:#cbd5e1;font-size:13px}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.doc-item{background:#0a1320;border-radius:10px;padding:4px;text-align:center;font-size:11px;color:#94a3b8}
.doc-item img{width:100%;max-height:150px;object-fit:contain;border-radius:6px;margin-bottom:4px}
.status-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.3px;margin:10px 0}
.status-pending{background:rgba(255,204,0,0.15);color:#ffcc00}
.password-box{background:linear-gradient(135deg,#0f2e22 0%,#142b27 100%);border:2px solid var(--green);border-radius:14px;padding:18px;margin:14px 0;text-align:center}
.password-box h3{color:var(--green);margin:0 0 10px;font-size:15px;font-weight:800}
.password-value{font-size:20px;font-weight:800;color:#ffdf70;margin:12px 0;padding:12px;background:rgba(0,0,0,0.3);border-radius:9px;letter-spacing:1px;font-family:monospace}
.btn-copy{background:linear-gradient(135deg,#16bd79 0%,#19d995 100%);color:white;padding:11px 18px;border-radius:10px;font-weight:800;font-size:13px}
.driver-item{background:linear-gradient(135deg,#243045 0%,#2a3650 100%);padding:14px;border-radius:13px;margin:10px 0;border:1px solid rgba(255,255,255,0.06)}
.driver-item h4{color:var(--yellow);margin:0 0 6px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.driver-item .meta{color:var(--text-muted);font-size:12px;line-height:1.6}
.driver-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin-left:6px}
.driver-badge.active{background:rgba(22,189,121,0.15);color:#19d995}
.driver-badge.blocked{background:rgba(227,75,89,0.15);color:#f05a68}
.commission-card{background:linear-gradient(135deg,#243045 0%,#2a3650 100%);padding:16px;border-radius:14px;margin:12px 0;border:1px solid rgba(255,255,255,0.06)}
.commission-card h3{color:var(--yellow);font-size:15px;font-weight:800;margin:0 0 8px}
.money-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.money-item{background:rgba(0,0,0,0.25);padding:11px;border-radius:9px}
.money-item span{display:block;color:var(--text-muted);font-size:11px;margin-bottom:4px}
.money-item strong{font-size:15px;font-weight:800}
.money-item .unpaid{color:#ffcc00}
.money-item .paid{color:#19d995}
.chat-box{background:#0f1826;border-radius:12px;padding:12px;max-height:430px;overflow-y:auto;margin:14px 0;border:1px solid rgba(255,255,255,0.05)}
.chat-message{padding:11px;margin:9px 0;border-radius:12px;max-width:88%;line-height:1.5;font-size:13px}
.chat-admin{background:linear-gradient(135deg,#344768 0%,#3d5178 100%);margin-left:auto;border:1px solid #526b91}
.chat-driver{background:linear-gradient(135deg,#183c35 0%,#1d463d 100%);margin-right:auto;border:1px solid #28745e}
.chat-meta{font-size:11px;color:#b8c5d8;margin-bottom:5px;font-weight:500}
.chat-compose{background:#0f1826;padding:10px;border-radius:12px;display:flex;gap:8px;align-items:flex-end}
.chat-compose textarea{flex:1;margin:0;min-height:46px;max-height:120px;resize:none}
.chat-empty{text-align:center;color:var(--text-muted);font-size:13px;padding:24px;font-style:italic}
.message{font-size:13px;line-height:1.5;padding:10px 0;font-weight:600;text-align:center}
.message.error{color:#f05a68}
.message.success{color:#19d995}
.empty{background:rgba(255,255,255,0.03);padding:18px;border-radius:11px;text-align:center;color:var(--text-muted);font-size:13px;border:1px dashed rgba(255,255,255,0.1)}
.hidden{display:none!important}
.small{font-size:12px;color:var(--text-muted);line-height:1.5}
@media(max-width:480px){main{padding:11px}.card{padding:15px}.money-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
  <h1>🛡 TULPAR TAXI</h1>
  <div class="subtitle">Әкімші кабинеті</div>
  <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">Шығу</button>
</header>

<main>

<section id="loginPanel" class="login-panel">
  <span class="login-icon">🔐</span>
  <h2>Әкімші кіруі</h2>
  <p>Басқару панеліне кіру үшін құпиясөзді енгізіңіз</p>
  <input id="password" type="password" placeholder="Әкімші құпиясөзі" autocomplete="current-password">
  <button class="btn-primary" id="loginButton" onclick="login()">КІРУ</button>
  <div id="loginMessage" class="message"></div>
</section>

<section id="appPanel" class="hidden">
  <div class="card">
    <h2>📋 Жүргізуші өтінімдері</h2>
    <button class="btn-refresh" onclick="loadApplications()">🔄 Жаңарту</button>
    <div id="listMessage" class="message"></div>
    <div id="credentialPanel"></div>
    <div id="applications"></div>
  </div>

  <div class="card">
    <h2>👥 Жүргізушілер тізімі</h2>
    <button class="btn-refresh" onclick="loadDrivers()">🔄 Жаңарту</button>
    <div id="driversMessage" class="message"></div>
    <div id="driversList"></div>
  </div>

  <div class="card">
    <h2>💬 Жүргізушілермен чат</h2>
    <select id="chatDriver" onchange="loadMessages()">
      <option value="">Жүргізушіні таңдаңыз</option>
    </select>
    <button class="btn-refresh" onclick="loadMessages()" style="margin-top:10px">🔄 Хаттарды жаңарту</button>
    <div id="chatMessage" class="message"></div>
    <div id="chatMessages" class="chat-box"><div class="chat-empty">Алдымен жүргізушіні таңдаңыз</div></div>
    <div class="chat-compose">
      <textarea id="chatInput" placeholder="Хабарлама жазыңыз..." maxlength="2000" rows="1"></textarea>
      <button class="btn-send" id="sendMessageButton" onclick="sendMessage()">📨</button>
    </div>
  </div>

  <div class="card">
    <h2>💰 Жүргізушілердің жалпы есебі</h2>
    <button class="btn-refresh" onclick="loadCommissions()">🔄 Жаңарту</button>
    <div id="commissionMessage" class="message"></div>
    <div id="commissions"></div>
  </div>
</section>

</main>

<script>
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){const n=Number(v||0);return(Number.isFinite(n)?n:0).toLocaleString("kk-KZ")+" ₸"}
function dateText(v){if(!v)return "—";const d=new Date(v);if(!Number.isFinite(d.getTime()))return "—";return d.toLocaleString("kk-KZ",{timeZone:"Asia/Almaty",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}

function showLogin(){$("loginPanel").classList.remove("hidden");$("appPanel").classList.add("hidden");$("logoutBtn").classList.add("hidden")}
function showApp(){$("loginPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");$("logoutBtn").classList.remove("hidden")}

async function checkAuth(){
  try{const r=await fetch("/api/admin?action=commissions",{credentials:"same-origin",cache:"no-store"});if(r.ok){showApp();loadAll();return}}catch(e){}
  showLogin();
}

async function login(){
  const password=$("password").value;
  if(!password){$("loginMessage").textContent="Құпиясөзді енгізіңіз";$("loginMessage").className="message error";return}
  $("loginMessage").textContent="Тексерілуде...";$("loginMessage").className="message";
  try{
    const r=await fetch("/api/admin?action=login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});
    const d=await r.json();
    if(!r.ok||!d.success){$("loginMessage").textContent=d.message||"Кіру сәтсіз";$("loginMessage").className="message error";return}
    $("password").value="";showApp();loadAll();
  }catch(e){$("loginMessage").textContent="Сервермен байланыс жоқ";$("loginMessage").className="message error"}
}

async function logout(){
  if(!confirm("Жүйеден шығасыз ба?"))return;
  try{await fetch("/api/admin?action=logout",{credentials:"same-origin"})}catch(e){}
  showLogin();
}

async function loadApplications(){
  $("listMessage").textContent="Өтінімдер жүктелуде...";$("listMessage").className="message";$("applications").innerHTML="";
  try{
    const r=await fetch("/api/admin?action=applications",{credentials:"same-origin",cache:"no-store"});
    const d=await r.json();
    if(r.status===401){showLogin();return}
    if(!r.ok||!d.success){$("listMessage").textContent=d.message||"Қате";$("listMessage").className="message error";return}
    const items=d.applications||[];
    $("listMessage").textContent="Барлық өтінім: "+items.length;
    if(!items.length){$("applications").innerHTML='<div class="empty">Әзірге өтінім жоқ</div>';return}
    
    const names={economy:"Эконом",comfort:"Бизнес",comfort_plus:"Бизнес+"};
    items.forEach(item=>{
      const card=document.createElement("div");card.className="application";card.dataset.phone=item.phone||"";
      
      const imgCar = item.car_photo_url ? `<div class="doc-item"><img src="${esc(item.car_photo_url)}">🚘 Көлік</div>` : '';
      const imgIdF = item.id_card_front_url ? `<div class="doc-item"><img src="${esc(item.id_card_front_url)}">🪪 Куәлік (алды)</div>` : '';
      const imgIdB = item.id_card_back_url ? `<div class="doc-item"><img src="${esc(item.id_card_back_url)}">🪪 Куәлік (арты)</div>` : '';
      const imgLic = item.driver_license_url ? `<div class="doc-item"><img src="${esc(item.driver_license_url)}">📄 Жүргізуші куәлігі</div>` : '';
      const imgSelf = item.selfie_url ? `<div class="doc-item"><img src="${esc(item.selfie_url)}">🤳 Селфи</div>` : '';

      card.innerHTML=`
        <h3>🚘 ${esc(item.full_name)}</h3>
        <div class="details">
          <b>Телефон:</b> ${esc(item.phone)}<br>
          <b>Көлік:</b> ${esc(item.car_brand)} ${esc(item.car_model)}<br>
          <b>Жылы:</b> ${esc(item.car_year||"—")}<br>
          <b>Нөмірі:</b> ${esc(item.car_number)}<br>
          <b>Санаты:</b> ${esc(names[item.car_class]||item.car_class)}
        </div>
        <div class="doc-grid">
          ${imgCar} ${imgIdF} ${imgIdB} ${imgLic} ${imgSelf}
        </div>
        <div class="status-badge status-pending">⏳ Күтуде</div><br>
        <button class="btn-approve" data-id="${esc(item.id)}" data-action="approve">✅ Мақұлдау</button>
        <button class="btn-reject" data-id="${esc(item.id)}" data-action="reject">❌ Қабылдамау</button>
      `;
      $("applications").appendChild(card);
    });
  }catch(e){$("listMessage").textContent="Жүктеу қатесі";$("listMessage").className="message error"}
}

async function updateApplication(id,action,button){
  if(!confirm(action==="approve"?"Жүргізушіні мақұлдаймыз ба?":"Өтінімді қабылдамаймыз ба?"))return;
  button.disabled=true;button.textContent="Күте тұрыңыз...";
  try{
    const r=await fetch(`/api/admin?action=${action}`,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
    const d=await r.json();
    if(r.status===401){showLogin();return}
    if(!r.ok||!d.success)throw new Error(d.message||"Қате");
    if(action==="approve"&&d.temporary_password){
      $("credentialPanel").innerHTML=`<div class="password-box"><h3>✅ Аккаунт жасалды</h3><div class="password-value">${esc(d.temporary_password)}</div><button class="btn-copy" onclick="navigator.clipboard.writeText('${esc(d.temporary_password)}');this.textContent='Көшірілді'">📋 Көшіру</button><p class="small" style="margin-top:10px">Бұл құпиясөзді жүргізушіге беріңіз!</p></div>`;
    }
    await Promise.all([loadApplications(),loadDrivers()]);
  }catch(e){alert(e.message);button.disabled=false;button.textContent="Қайталау"}
}

async function loadDrivers(){
  $("driversMessage").textContent="Жүктелуде...";$("driversList").innerHTML="";
  try{
    const r=await fetch("/api/admin?action=drivers",{credentials:"same-origin",cache:"no-store"});
    const d=await r.json();
    if(r.status===401){showLogin();return}
    const drivers=d.drivers||[];
    $("driversMessage").textContent="Барлық жүргізуші: "+drivers.length;
    if(!drivers.length){$("driversList").innerHTML='<div class="empty">Жүргізуші жоқ</div>';return}

    const select=$("chatDriver"),prev=select.value;select.innerHTML='<option value="">Жүргізушіні таңдаңыз</option>';
    
    drivers.forEach(driver=>{
      const card=document.createElement("div");card.className="driver-item";
      const isBlocked=driver.is_blocked===true;
      const isDeleted=!!driver.deleted_at;
      card.innerHTML=`
        <h4>👤 ${esc(driver.full_name||"Белгісіз")} <span class="driver-badge ${(isBlocked||isDeleted)?'blocked':'active'}">${isDeleted?'Өшірілген':isBlocked?'Бұғатталған':'Белсенді'}</span></h4>
        <div class="meta">📞 ${esc(driver.phone||"—")}</div>
        <div style="margin-top:10px">${!isDeleted?`${isBlocked?`<button class="btn-unblock" data-id="${esc(driver.id)}" data-action="unblock_driver">🔓 Ашу</button>`:`<button class="btn-block" data-id="${esc(driver.id)}" data-action="block_driver">🔒 Бұғаттау</button>`}<button class="btn-delete" data-id="${esc(driver.id)}" data-action="delete_driver">🗑 Өшіру</button>`:''}</div>
      `;
      $("driversList").appendChild(card);
      if(!isDeleted){const opt=document.createElement("option");opt.value=driver.id;opt.textContent=driver.full_name;select.appendChild(opt)}
    });
    if(prev&&[...select.options].some(o=>o.value===prev))select.value=prev;
  }catch(e){$("driversMessage").textContent="Қате"}
}

async function driverAction(id,action,btn){
  if(!confirm("Растайсыз ба?"))return;btn.disabled=true;
  try{
    await fetch(`/api/admin?action=${action}`,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({driver_id:id})});
    await loadDrivers();
  }catch(e){alert("Қате")}
}

async function loadCommissions(){
  $("commissionMessage").textContent="Жүктелуде...";$("commissions").innerHTML="";
  try{
    const r=await fetch("/api/admin?action=commissions",{credentials:"same-origin",cache:"no-store"});
    const d=await r.json();
    if(r.status===401){showLogin();return}
    const items=d.commissions||[];
    if(!items.length){$("commissionMessage").textContent="Комиссия жоқ";return}
    
    const grouped = {};
    items.forEach(item => {
      if(!item.drivers) return;
      const driverId = item.driver_id;
      if(!grouped[driverId]) {
        grouped[driverId] = { name: item.drivers.full_name || "Белгісіз", phone: item.drivers.phone || "—", unpaid: 0, paid: 0 };
      }
      const amount = Number(item.commission_amount || 0);
      if (item.status === "paid") { grouped[driverId].paid += amount; } 
      else { grouped[driverId].unpaid += amount; }
    });

    $("commissionMessage").textContent="Жүргізушілер саны: " + Object.keys(grouped).length;
    
    Object.values(grouped).forEach(item=>{
      const card=document.createElement("div");card.className="commission-card";
      card.innerHTML=`
        <h3>🚘 ${esc(item.name)}</h3>
        <div class="small">📞 ${esc(item.phone)}</div>
        <div class="money-grid">
          <div class="money-item"><span>Төленбеген</span><strong class="unpaid">${money(item.unpaid)}</strong></div>
          <div class="money-item"><span>Төленген</span><strong class="paid">${money(item.paid)}</strong></div>
        </div>
      `;
      $("commissions").appendChild(card);
    });
  }catch(e){$("commissionMessage").textContent="Қате"}
}

async function loadMessages(){
  const driverId=$("chatDriver").value;
  if(!driverId){$("chatMessages").innerHTML='<div class="chat-empty">Жүргізушіні таңдаңыз</div>';return}
  try{
    const r=await fetch("/api/admin?action=messages&driver_id="+encodeURIComponent(driverId),{credentials:"same-origin",cache:"no-store"});
    const d=await r.json();
    const box=$("chatMessages");box.innerHTML="";
    if(!d.messages||!d.messages.length){box.innerHTML='<div class="chat-empty">Хат жоқ</div>';return}
    d.messages.forEach(m=>{
      const isAdmin=m.sender_role==="admin";
      const msg=document.createElement("div");msg.className="chat-message "+(isAdmin?"chat-admin":"chat-driver");
      msg.innerHTML=`<div class="chat-meta">${isAdmin?"Сіз":"Жүргізуші"} • ${dateText(m.created_at)}</div>${esc(m.message)}`;
      box.appendChild(msg);
    });
    box.scrollTop=box.scrollHeight;
  }catch(e){}
}

async function sendMessage(){
  const driverId=$("chatDriver").value,message=$("chatInput").value.trim();
  if(!driverId||!message)return;
  $("sendMessageButton").disabled=true;
  try{
    await fetch("/api/admin?action=send_message",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({driver_id:driverId,message})});
    $("chatInput").value="";await loadMessages();
  }catch(e){alert("Қате")}finally{$("sendMessageButton").disabled=false}
}

async function loadAll(){await Promise.all([loadApplications(),loadDrivers(),loadCommissions()])}

document.addEventListener("click",e=>{
  const appBtn=e.target.closest("button[data-action][data-id]");
  if(appBtn&&!appBtn.dataset.driverId){
    if(["approve","reject"].includes(appBtn.dataset.action))updateApplication(appBtn.dataset.id,appBtn.dataset.action,appBtn);
  }
  const drvBtn=e.target.closest("button[data-action][data-id]");
  if(drvBtn&&["block_driver","unblock_driver","delete_driver"].includes(drvBtn.dataset.action)){
    driverAction(drvBtn.dataset.id,drvBtn.dataset.action,drvBtn);
  }
});

document.addEventListener("DOMContentLoaded",()=>{
  checkAuth();
  $("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
  $("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
});
</script>
</body>
