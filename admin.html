
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ҮРЖАР TAXI — Әкімші</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101522;color:#fff;font-family:Arial,sans-serif}
.container{max-width:850px;margin:auto}
header,.panel,.application,.commission-card,.history-card{background:#202b40;border-radius:16px;padding:20px;margin-bottom:16px}
h1{color:#ffcc00;margin:0}
.subtitle,.small{color:#aebbd0}
input{width:100%;padding:15px;border-radius:10px;border:1px solid #52617b;background:#111a2a;color:white;font-size:16px;margin:10px 0}
button{border:0;border-radius:10px;padding:13px 17px;font-weight:bold;font-size:15px;cursor:pointer;margin:5px 4px 5px 0}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#ffcc00;color:#171717}
.approve{background:#19b875;color:white}
.reject{background:#e34b59;color:white}
.refresh{background:#405575;color:white}
.copy{background:#ffcc00;color:#171717}
.paid{background:#19b875;color:white}
.message{color:#ffcc00;margin:12px 0}
.details{line-height:1.8;color:#e1e8f3}
.application{background:#26344d}
.application h3{color:#ffcc00}
.car-photo{width:100%;max-height:300px;object-fit:contain;background:#111a2a;border-radius:12px;margin-top:12px}
.status{font-weight:bold;margin:12px 0}
.pending{color:#ffcc00}
.approved{color:#19d995}
.rejected{color:#ff7b85}
.password-box{background:#142b27;border:1px solid #19b875;border-radius:12px;padding:16px;margin:15px 0}
.password-value{font-size:20px;font-weight:bold;overflow-wrap:anywhere;color:#ffdf70;margin:12px 0}
.hidden{display:none}
.commission-card{background:#26344d;border:1px solid #405575}
.commission-card h3,.history-card h3{color:#ffcc00;margin-top:0}
.money-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}
.money-item{background:#172237;padding:13px;border-radius:10px}
.money-item span{display:block;color:#aebbd0;font-size:13px;margin-bottom:7px}
.money-item strong{font-size:18px;overflow-wrap:anywhere}
.unpaid{color:#ffcc00}
.received{color:#19d995}
.week{color:#aebbd0;font-size:14px;line-height:1.6}
.commission-note{color:#aebbd0;font-size:13px;line-height:1.5}
.history-card{background:#172b2a;border:1px solid #23775b}
.history-card h3{color:#19d995}
.history-date{color:#aebbd0;font-size:13px;line-height:1.6}
.history-amount{font-size:23px;font-weight:bold;color:#19d995;margin:12px 0}
.empty{background:#172237;padding:16px;border-radius:10px;color:#aebbd0;line-height:1.6}
@media(max-width:480px){
body{padding:10px}
header,.panel,.application,.commission-card,.history-card{padding:15px}
.money-grid{grid-template-columns:1fr 1fr}
.money-item strong{font-size:16px}
}
</style>
</head>
<body>
<div class="container">

<header>
<h1>🚕 ҮРЖАР TAXI</h1>
<div class="subtitle">Әкімші кабинеті • Жүргізушілерді басқару</div>
</header>

<section id="loginPanel" class="panel">
<h2>🔐 Әкімші жүйесіне кіру</h2>
<input id="password" type="password" placeholder="Әкімші құпиясөзі">
<button class="primary" id="loginButton">Кіру</button>
<div id="loginMessage" class="message"></div>
</section>

<section id="applicationsPanel" class="hidden">

<div class="panel">
<h2>📋 Жүргізушілер өтінімдері</h2>
<button class="refresh" id="refreshButton">🔄 Жаңарту</button>
<div id="listMessage" class="message"></div>
<div id="credentialPanel"></div>
<div id="applications"></div>
</div>

<div class="panel">
<h2>💰 Апталық комиссиялар</h2>
<div class="small">Әр жүргізушіден орындалған тапсырыстардың 10% комиссия есептеледі.</div>
<button class="refresh" id="refreshCommissionsButton">🔄 Комиссияларды жаңарту</button>
<div id="commissionMessage" class="message"></div>
<div id="commissions"></div>
</div>

<div class="panel">
<h2>💳 Төлем тарихы</h2>
<div class="small">Нақты төленген комиссиялар және олардың төлем күндері.</div>
<button class="refresh" id="refreshHistoryButton">🔄 Тарихты жаңарту</button>
<div id="historyMessage" class="message"></div>
<div id="paymentHistory"></div>
</div>

</section>
</div>

<script>
const loginPanel=document.getElementById("loginPanel");
const applicationsPanel=document.getElementById("applicationsPanel");
const loginMessage=document.getElementById("loginMessage");
const listMessage=document.getElementById("listMessage");
const applicationsBox=document.getElementById("applications");
const credentialPanel=document.getElementById("credentialPanel");
const commissionMessage=document.getElementById("commissionMessage");
const commissionsBox=document.getElementById("commissions");
const historyMessage=document.getElementById("historyMessage");
const historyBox=document.getElementById("paymentHistory");

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);
}

function money(v){
const n=Number(v||0);
return (Number.isFinite(n)?n:0).toLocaleString("kk-KZ")+" ₸";
}

function dateText(v){
if(!v)return "Көрсетілмеген";
const d=new Date(v);
if(!Number.isFinite(d.getTime()))return "Көрсетілмеген";
return d.toLocaleString("kk-KZ",{
timeZone:"Asia/Almaty",
year:"numeric",
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
});
}

function showLogin(){
loginPanel.classList.remove("hidden");
applicationsPanel.classList.add("hidden");
}

function showApplications(){
loginPanel.classList.add("hidden");
applicationsPanel.classList.remove("hidden");
}

async function login(){
const password=document.getElementById("password").value;

if(!password){
loginMessage.textContent="Құпиясөзді енгізіңіз";
return;
}

loginMessage.textContent="Тексерілуде...";

try{
const r=await fetch("/api/admin-login",{
method:"POST",
credentials:"same-origin",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({password})
});

const d=await r.json();

if(!r.ok||!d.success){
loginMessage.textContent=d.message||"Кіру сәтсіз";
return;
}

document.getElementById("password").value="";
showApplications();

await Promise.all([
loadApplications(),
loadCommissions()
]);

}catch(e){
loginMessage.textContent="Сервермен байланыс жоқ";
}
}

function showTemporaryPassword(data){
credentialPanel.innerHTML="";

const box=document.createElement("div");
box.className="password-box";

const heading=document.createElement("h3");
heading.textContent="✅ Жүргізуші аккаунты жасалды";
box.appendChild(heading);

const phone=document.createElement("div");
phone.textContent="Жүргізуші телефоны: "+data.phone;
box.appendChild(phone);

const title=document.createElement("p");
title.textContent="Уақытша құпиясөз:";
box.appendChild(title);

const value=document.createElement("div");
value.className="password-value";
value.textContent=data.temporary_password;
box.appendChild(value);

const copy=document.createElement("button");
copy.className="copy";
copy.textContent="📋 Құпиясөзді көшіру";

copy.addEventListener("click",async()=>{
try{
await navigator.clipboard.writeText(data.temporary_password);
copy.textContent="✅ Көшірілді";
}catch(e){
copy.textContent="Көшіру мүмкін болмады";
}
});

box.appendChild(copy);

const warning=document.createElement("p");
warning.className="small";
warning.textContent=
"Маңызды: бұл құпиясөз тек осы экранда көрсетіледі. Оны жүргізушіге қауіпсіз жеке арнамен жеткізіңіз.";
box.appendChild(warning);

credentialPanel.appendChild(box);
}

async function loadApplications(){
listMessage.textContent="Өтінімдер жүктелуде...";
applicationsBox.innerHTML="";

try{
const r=await fetch("/api/admin-applications",{
credentials:"same-origin",
cache:"no-store"
});

const d=await r.json();

if(r.status===401){
showLogin();
loginMessage.textContent="Қайта кіру қажет";
return;
}

if(!r.ok||!d.success){
listMessage.textContent=d.message||"Өтінімдерді алу мүмкін болмады";
return;
}

const items=d.applications||[];

listMessage.textContent="Барлық өтінім саны: "+items.length;

if(!items.length){
applicationsBox.textContent="Әзірге өтінім жоқ";
return;
}

items.forEach(item=>{
const card=document.createElement("div");
card.className="application";
card.dataset.phone=item.phone||"";

const photo=
typeof item.photo_url==="string"&&/^https:\/\//i.test(item.photo_url)
?'<img class="car-photo" src="'+esc(item.photo_url)+'" alt="Көлік фотосы">'
:'<p class="small">Көлік фотосы қолжетімсіз</p>';

const names={
economy:"Эконом",
comfort:"Комфорт",
comfort_plus:"Комфорт+"
};

const statuses={
pending:"⏳ Күтуде",
approved:"✅ Мақұлданды",
rejected:"❌ Қабылданбады"
};

card.innerHTML=`
<h3>🚘 ${esc(item.full_name)}</h3>
<div class="details">
<b>Телефон:</b> ${esc(item.phone)}<br>
<b>Көлік:</b> ${esc(item.car_brand)} ${esc(item.car_model)}<br>
<b>Жылы:</b> ${esc(item.car_year||"—")}<br>
<b>Нөмірі:</b> ${esc(item.car_number)}<br>
<b>Санаты:</b> ${esc(names[item.car_class]||item.car_class)}<br>
<b>Уақыты:</b> ${esc(item.created_at?dateText(item.created_at):"—")}
</div>
${photo}
<div class="status ${esc(item.status)}">${esc(statuses[item.status]||item.status)}</div>
${item.status==="pending"?
`<button class="approve" data-id="${esc(item.id)}" data-status="approved">✅ Мақұлдау</button>
<button class="reject" data-id="${esc(item.id)}" data-status="rejected">❌ Қабылдамау</button>`:""}
`;

applicationsBox.appendChild(card);
});

}catch(e){
listMessage.textContent="Жүктеу кезінде қате пайда болды";
}
}

async function loadCommissions(){
commissionMessage.textContent="Комиссиялар жүктелуде...";
commissionsBox.innerHTML="";
historyMessage.textContent="Төлем тарихы жүктелуде...";
historyBox.innerHTML="";

try{
const r=await fetch("/api/admin-commissions",{
method:"GET",
credentials:"same-origin",
cache:"no-store"
});

const d=await r.json();

if(r.status===401){
showLogin();
loginMessage.textContent="Әкімші жүйесіне қайта кіріңіз";
return;
}

if(!r.ok||!d.success){
commissionMessage.textContent=d.message||"Комиссияларды алу мүмкін болмады";
historyMessage.textContent="Төлем тарихын алу мүмкін болмады";
return;
}

const items=d.commissions||[];

if(!items.length){
commissionMessage.textContent="Әзірге есептелген комиссия жоқ";
}else{
commissionMessage.textContent="Апталық есептер саны: "+items.length;

items.forEach(item=>{
const card=document.createElement("div");
card.className="commission-card";

const unpaid=Number(item.unpaid_total||0);
const paid=Number(item.paid_total||0);
const driverName=item.driver_name||"Жүргізуші";
const weekStart=item.week_start||"";
const weekEnd=item.week_end||"";

card.innerHTML=`
<h3>🚘 ${esc(driverName)}</h3>
<div class="details">
<b>Телефон:</b> ${esc(item.driver_phone||"—")}<br>
<b>Тапсырыс саны:</b> ${esc(item.rides_count||0)}
</div>
<div class="week">
📅 Апта: ${esc(dateText(weekStart))} — ${esc(dateText(weekEnd))}
</div>

<div class="money-grid">
<div class="money-item">
<span>Жалпы тапсырыс сомасы</span>
<strong>${money(item.gross_total)}</strong>
</div>
<div class="money-item">
<span>Біздің 10% комиссия</span>
<strong>${money(item.commission_total)}</strong>
</div>
<div class="money-item">
<span>Төленген комиссия</span>
<strong class="received">${money(paid)}</strong>
</div>
<div class="money-item">
<span>Төленбеген комиссия</span>
<strong class="unpaid">${money(unpaid)}</strong>
</div>
</div>

${unpaid>0?
`<button class="paid"
data-driver-id="${esc(item.driver_id)}"
data-week-start="${esc(weekStart)}"
data-week-end="${esc(weekEnd)}">
✅ Төленді деп белгілеу
</button>`:
'<div class="status received">✅ Комиссия толық төленген</div>'}

<p class="commission-note">
Бұл батырманы жүргізушіден комиссия ақшасы нақты алынғаннан кейін ғана басыңыз.
</p>
`;

commissionsBox.appendChild(card);
});
}

renderPaymentHistory(d.payment_history||[]);

}catch(e){
commissionMessage.textContent="Комиссияларды жүктеу кезінде қате";
historyMessage.textContent="Төлем тарихын жүктеу кезінде қате";
}
}

function renderPaymentHistory(items){
historyBox.innerHTML="";

if(!items.length){
historyMessage.textContent="Әзірге төленген комиссия тарихы жоқ";
historyBox.innerHTML=
'<div class="empty">Комиссия нақты төленіп, әкімші растағаннан кейін осы жерде сақталады.</div>';
return;
}

historyMessage.textContent="Төлем жазбалары: "+items.length;

items.forEach(item=>{
const card=document.createElement("div");
card.className="history-card";

card.innerHTML=`
<h3>✅ ${esc(item.driver_name||"Жүргізуші")}</h3>
<div class="details">
<b>Телефон:</b> ${esc(item.driver_phone||"—")}<br>
<b>Сапар саны:</b> ${esc(item.rides_count||0)}
</div>
<div class="history-date">
<b>Қай апта үшін:</b><br>
${esc(dateText(item.week_start))} — ${esc(dateText(item.week_end))}
<br><br>
<b>Төленген күні:</b><br>
${esc(dateText(item.paid_at))}
</div>
<div class="history-amount">${money(item.paid_total)}</div>
<div class="status received">✅ Төлем қабылданды деп белгіленген</div>
`;

historyBox.appendChild(card);
});
}

async function markCommissionPaid(button){
const driverId=button.dataset.driverId;
const weekStart=button.dataset.weekStart;
const weekEnd=button.dataset.weekEnd;

if(!driverId||!weekStart||!weekEnd){
commissionMessage.textContent="Есеп деректері толық емес";
return;
}

const confirmed=confirm(
"Осы жүргізушіден осы аптаның 10% комиссия ақшасын нақты алдыңыз ба?\n\nТек ақша қолыңызға түскен болса ғана растаңыз."
);

if(!confirmed)return;

button.disabled=true;
button.textContent="Өңделуде...";

try{
const r=await fetch("/api/admin-commissions",{
method:"POST",
credentials:"same-origin",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
driver_id:driverId,
week_start:weekStart,
week_end:weekEnd
})
});

const d=await r.json();

if(r.status===401){
showLogin();
loginMessage.textContent="Әкімші жүйесіне қайта кіріңіз";
return;
}

if(!r.ok||!d.success){
commissionMessage.textContent=d.message||"Комиссияны белгілеу мүмкін болмады";
button.disabled=false;
button.textContent="✅ Төленді деп белгілеу";
return;
}

commissionMessage.textContent=
"✅ Төлем белгіленді. Қабылданған комиссия: "+
money(d.commission_paid);

await loadCommissions();

}catch(e){
commissionMessage.textContent="Сервермен байланыс қатесі";
button.disabled=false;
button.textContent="✅ Төленді деп белгілеу";
}
}

async function updateApplication(id,status,button){
const question=status==="approved"
?"Жүргізушіні мақұлдап, аккаунтын жасаймыз ба?"
:"Өтінімді қабылдамаймыз ба?";

if(!confirm(question))return;

const card=button.closest(".application");
const driverPhone=card?.dataset.phone||"";

button.disabled=true;
listMessage.textContent="Өтінім өңделуде...";

try{
const r=await fetch("/api/admin-update",{
method:"POST",
credentials:"same-origin",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id,status})
});

const d=await r.json();

if(r.status===401){
showLogin();
loginMessage.textContent="Қайта кіру қажет";
return;
}

if(!r.ok||!d.success){
listMessage.textContent=d.message||"Өтінімді өңдеу мүмкін болмады";
button.disabled=false;
return;
}

if(status==="approved"){
if(!d.temporary_password){
listMessage.textContent="Аккаунт жасалды, бірақ уақытша құпиясөз серверден келмеді. Әкімшіге хабарласыңыз.";
button.disabled=false;
return;
}

showTemporaryPassword({
phone:driverPhone,
temporary_password:d.temporary_password
});
}

listMessage.textContent=d.message||"Дайын";
await loadApplications();

}catch(e){
listMessage.textContent="Сервермен байланыс қатесі";
button.disabled=false;
}
}

document.getElementById("loginButton")
.addEventListener("click",login);

document.getElementById("refreshButton")
.addEventListener("click",loadApplications);

document.getElementById("refreshCommissionsButton")
.addEventListener("click",loadCommissions);

document.getElementById("refreshHistoryButton")
.addEventListener("click",loadCommissions);

document.getElementById("password")
.addEventListener("keydown",e=>{
if(e.key==="Enter")login();
});

applicationsBox.addEventListener("click",e=>{
const button=e.target.closest("button[data-id]");
if(button){
updateApplication(
button.dataset.id,
button.dataset.status,
button
);
}
});

commissionsBox.addEventListener("click",e=>{
const button=e.target.closest("button[data-driver-id]");
if(button){
markCommissionPaid(button);
}
});
</script>
</body>
</html>
