<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TULPAR TAXI — Әкімшілік</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --yellow: #ffcc00; --green: #16bd79; --red: #e34b59; --bg-dark: #101522; --panel-bg: rgba(28, 37, 54, 0.95); --border: #2e3a52; --text-muted: #94a3b8; }
body { margin: 0; padding: 0; background: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden; position: fixed; top: 0; left: 0; width: 100vw; }
.page-container { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 60px); z-index: 15; background: var(--bg-dark); display: none; overflow-y: auto; padding: 15px; padding-bottom: 30px; }
.page-container.active { display: block; }
.page-header { font-size: 20px; font-weight: 900; color: white; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
.logout-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
.card { background: var(--panel-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.card-title { color: var(--yellow); font-size: 15px; font-weight: 800; margin-bottom: 12px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; }
.stat-box small { color: var(--text-muted); font-size: 11px; display: block; margin-bottom: 4px; }
.stat-box strong { font-size: 18px; font-weight: 800; display: block; }
.order-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 14px; margin-bottom: 10px; border: 1px solid var(--border); }
.order-card .price { font-size: 20px; color: var(--yellow); font-weight: 900; margin-bottom: 8px; }
.order-card .addr { font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-bottom: 10px; }
.empty-state { text-align: center; color: var(--text-muted); padding: 20px; font-style: italic; }
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; z-index: 20; background: #17191e; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.nav-item { color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; cursor: pointer; width: 33%; }
.nav-item.active { color: var(--yellow); }
.nav-item .icon { font-size: 22px; line-height: 1; }
.loading-indicator { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; display: none; z-index: 50; color: var(--yellow); }
.btn-action { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 5px; }
.btn-action.red { background: rgba(227,75,89,0.2); color: var(--red); border: 1px solid rgba(227,75,89,0.3); }
.btn-action.green { background: rgba(22,189,121,0.2); color: var(--green); border: 1px solid rgba(22,189,121,0.3); }
</style>
</head>
<body>

<div class="loading-indicator" id="loadingIndicator">⏳ Жүктелуде...</div>

<div class="page-container active" id="page-stats">
    <div class="page-header">
        <span>📊 Басқару панелі</span>
        <button class="logout-btn" onclick="logout()">Шығу</button>
    </div>
    <div class="card">
        <div class="card-title">📈 Жалпы статистика</div>
        <div class="stats-grid">
            <div class="stat-box"><small>Барлық тапсырыс</small><strong id="stat-total-orders">—</strong></div>
            <div class="stat-box"><small>Аяқталған сапар</small><strong id="stat-completed">—</strong></div>
            <div class="stat-box"><small>Жалпы айналым</small><strong id="stat-gross">—</strong></div>
            <div class="stat-box"><small>Жүйе табысы (10%)</small><strong id="stat-commission" style="color:var(--green)">—</strong></div>
        </div>
    </div>
    <div class="card">
        <div class="card-title">👥 Жүргізушілерді басқару</div>
        <div id="driversList"></div>
    </div>
</div>

<div class="page-container" id="page-orders">
    <div class="page-header">
        <span>🚕 Барлық тапсырыстар</span>
        <button class="logout-btn" onclick="loadOrders()">🔄 Жаңарту</button>
    </div>
    <div id="ordersList"></div>
</div>

<div class="page-container" id="page-chat">
    <div class="page-header">
        <span>💬 Жүргізушілермен чат</span>
    </div>
    <div id="chatDriversList"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('stats')" id="nav-stats">
        <span class="icon">📊</span><span>Статистика</span>
    </div>
    <div class="nav-item" onclick="switchTab('orders')" id="nav-orders">
        <span class="icon">🚕</span><span>Тапсырыстар</span>
    </div>
    <div class="nav-item" onclick="switchTab('chat')" id="nav-chat">
        <span class="icon">💬</span><span>Чат</span>
    </div>
</div>

<script>
const money = n => Number(n || 0).toLocaleString("kk-KZ") + " ₸";
function escapeHtml(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function showLoading(show) { document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none'; }

async function api(url, options = {}) {
    const res = await fetch(url, { credentials: "include", ...options });
    if (res.status === 401 || res.status === 403) { 
        window.location.href = "/admin-login.html"; 
        throw new Error("Сессия аяқталды"); 
    }
    const data = await res.json();
    if (!res.ok || data.success === false) throw new Error(data.message || "Қате");
    return data;
}

function switchTab(tab) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + tab).classList.add('active');
    document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    if (tab === 'stats') loadStats();
    if (tab === 'orders') loadOrders();
    if (tab === 'chat') loadDriversForChat();
}

async function loadStats() {
    showLoading(true);
    try {
        // Бэкендте 'stats' әрекеті жоқ болса, бұл жерде қате шығады. 
        // Бірақ қазір бізге ең бастысы - жүргізушілер тізімін алу.
        const driversData = await api("/api/admin?action=drivers");
        const driversBox = document.getElementById("driversList");
        
        // Статистиканы бос қалдырамыз (бэкендте жоқ болса)
        document.getElementById("stat-total-orders").textContent = "0";
        document.getElementById("stat-completed").textContent = "0";
        document.getElementById("stat-gross").textContent = "0 ₸";
        document.getElementById("stat-commission").textContent = "0 ₸";

        if (!driversData.drivers || driversData.drivers.length === 0) {
            driversBox.innerHTML = '<div class="empty-state">Жүргізушілер жоқ</div>';
        } else {
            driversBox.innerHTML = driversData.drivers.map(dr => {
                const isBlocked = dr.is_blocked;
                // Бэкендтегі нақты әрекеттер: block_driver және unblock_driver
                const blockBtn = isBlocked 
                    ? `<button class="btn-action green" onclick="toggleBlockDriver('${dr.id}', false)">Бұғаттан шығару</button>`
                    : `<button class="btn-action red" onclick="toggleBlockDriver('${dr.id}', true)">Бұғаттау</button>`;
                
                return `
                <div class="order-card" style="padding:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <strong style="font-size:15px;">${escapeHtml(dr.full_name)}</strong>
                            <div style="font-size:12px;color:var(--text-muted); margin-top:2px;">${escapeHtml(dr.phone)}</div>
                        </div>
                        <div style="text-align:right;">${blockBtn}</div>
                    </div>
                </div>
                `;
            }).join('');
        }
    } catch (e) { 
        console.error(e);
        if(e.message !== "Сессия аяқталды") alert("❌ " + e.message); 
    } finally { showLoading(false); }
}

async function toggleBlockDriver(driverId, blockStatus) {
    // Бэкендтегі нақты әрекет атаулары
    const action = blockStatus ? "block_driver" : "unblock_driver";
    const actionText = blockStatus ? "бұғаттайсыз ба?" : "бұғаттан шығарасыз ба?";
    if (!confirm(`Бұл жүргізушіні ${actionText}`)) return;
    showLoading(true);
    try {
        await api(`/api/admin?action=${action}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ driver_id: driverId }) // Бэкендте дәл осылай күтіледі
        });
        await loadStats(); // Тізімді жаңарту
    } catch (e) {
        alert("❌ " + e.message);
    } finally {
        showLoading(false);
    }
}

async function loadOrders() {
    showLoading(true);
    try {
        const d = await api("/api/admin?action=applications"); // Бэкендте 'applications' деп аталады
        const box = document.getElementById("ordersList");
        if (!d.applications || d.applications.length === 0) {
            box.innerHTML = '<div class="empty-state">Жаңа өтінімдер жоқ</div>';
        } else {
            box.innerHTML = d.applications.map(app => `
                <div class="order-card">
                    <div style="display:flex; justify-content:space-between;">
                        <div class="price">${escapeHtml(app.full_name)}</div>
                    </div>
                    <div class="addr">📞 ${escapeHtml(app.phone)}<br>🚗 ${escapeHtml(app.car_brand)} ${escapeHtml(app.car_model)} (${escapeHtml(app.car_number)})</div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button class="btn-action green" onclick="approveApp('${app.id}')">✅ Бекіту</button>
                        <button class="btn-action red" onclick="rejectApp('${app.id}')">❌ Бас тарту</button>
                    </div>
                </div>
            `).join('');
        }
    } catch (e) { 
        if(e.message !== "Сессия аяқталды") alert("❌ " + e.message); 
    } finally { showLoading(false); }
}

async function approveApp(id) {
    if(!confirm("Бұл өтінімді бекітесіз бе? Жүргізушіге уақытша құпиясөз беріледі.")) return;
    showLoading(true);
    try {
        const d = await api("/api/admin?action=approve", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ id }) });
        alert("✅ Бекітілді!\nУақытша құпиясөз: " + d.temporary_password + "\n(Оны жүргізушіге жіберіңіз)");
        loadOrders();
    } catch (e) { alert("❌ " + e.message); } finally { showLoading(false); }
}

async function rejectApp(id) {
    if(!confirm("Бұл өтінімнен бас тартасыз ба?")) return;
    showLoading(true);
    try {
        await api("/api/admin?action=reject", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ id }) });
        loadOrders();
    } catch (e) { alert("❌ " + e.message); } finally { showLoading(false); }
}

async function loadDriversForChat() {
    showLoading(true);
    try {
        const d = await api("/api/admin?action=drivers");
        const box = document.getElementById("chatDriversList");
        if (!d.drivers || d.drivers.length === 0) {
            box.innerHTML = '<div class="empty-state">Жүргізушілер жоқ</div>';
        } else {
            box.innerHTML = d.drivers.map(dr => `
                <div class="order-card" style="padding:12px; cursor:pointer;" onclick="alert('Чат: ${escapeHtml(dr.full_name)}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>${escapeHtml(dr.full_name)}</strong>
                        <span style="color:var(--yellow); font-size:20px;">💬</span>
                    </div>
                </div>
            `).join('');
        }
    } catch (e) { 
        if(e.message !== "Сессия аяқталды") alert("❌ " + e.message); 
    } finally { showLoading(false); }
}

async function logout() {
    if (!confirm("Жүйеден шығасыз ба?")) return;
    document.cookie = "urzhar_admin_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    window.location.href = "/admin-login.html";
}

document.addEventListener('DOMContentLoaded', () => {
    loadStats();
});
</script>
</body>
</html>
