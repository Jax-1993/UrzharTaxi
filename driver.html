
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ҮРЖАР TAXI — Жүргізуші кабинеті</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#fff;font-family:Arial,sans-serif}
header{background:#202a3b;padding:20px;text-align:center;border-bottom:2px solid #ffcc00}
header h2{margin:0;color:#ffcc00}
main{max-width:650px;margin:auto;padding:16px}
.card{background:#202a3b;border-radius:15px;padding:17px;margin:14px 0}
h3{margin-top:0;color:#ffcc00}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#303d52;padding:15px;border-radius:12px}
.stat small{color:#c5cede}
.stat strong{display:block;font-size:22px;margin-top:8px}
button{background:#ffcc00;color:#151515;border:0;padding:13px 18px;border-radius:9px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.order{background:#303d52;padding:14px;border-radius:10px;margin:10px 0}
.muted{color:#b9c2d0;font-size:13px}
.error{color:#ff9999}
.order-time{
 background:#1d493d;
 border:1px solid #238b68;
 padding:11px;
 border-radius:9px;
 margin:10px 0;
 line-height:1.8;
 color:#8fffc8;
 font-size:14px;
}
.order-section{margin-top:18px}
.order-section h4{color:#ffcc00;margin:10px 0}
</style>
</head>
<body>

<header>
<h2>🚕 ҮРЖАР TAXI</h2>
<div>Жүргізуші кабинеті</div>
</header>

<main>

<div class="card">
<h3>📊 Менің статистикам</h3>
<div class="stats">
<div class="stat">
<small>Орындалған сапар</small>
<strong id="rides">—</strong>
</div>
<div class="stat">
<small>Жалпы айналым</small>
<strong id="gross">—</strong>
</div>
<div class="stat">
<small>Жүргізуші табысы</small>
<strong id="earning">—</strong>
</div>
<div class="stat">
<small>10% комиссия</small>
<strong id="commission">—</strong>
</div>
</div>
</div>

<div class="card">
<h3>📅 Апталық комиссия</h3>
<p>Төленбеген: <strong id="unpaid">—</strong></p>
<p>Төленген: <strong id="paid">—</strong></p>
<p class="muted" id="week"></p>
</div>

<div class="card">
<h3>🚕 Тапсырыстар</h3>

<div class="order-section">
<h4>🟢 Жаңа тапсырыстар</h4>
<div id="newOrders" class="muted">
Тапсырыстар жүктелуде...
</div>
</div>

<div class="order-section">
<h4>📋 Менің сапарларым</h4>
<div id="myOrders" class="muted">
Жүктелуде...
</div>
</div>
</div>

<div class="card">
<button onclick="loadAll()" id="refresh">Жаңарту</button>
<p id="message" class="muted"></p>
</div>

</main>

<script>
const money = n =>
 Number(n || 0).toLocaleString("kk-KZ") + " ₸";

async function api(url) {
 const response = await fetch(url,{
  credentials:"include"
 });

 const data = await response.json();

 if(!response.ok || data.success === false){
  throw new Error(data.message || "Қате орын алды");
 }

 return data;
}

async function loadStats(){
 const data = await api("/api/driver-stats");

 document.getElementById("rides").textContent=data.ridesCount;
 document.getElementById("gross").textContent=money(data.grossTotal);
 document.getElementById("earning").textContent=money(data.driverEarning);
 document.getElementById("commission").textContent=money(data.commissionTotal);
 document.getElementById("unpaid").textContent=money(data.weekly.unpaid);
 document.getElementById("paid").textContent=money(data.weekly.paid);

 document.getElementById("week").textContent=
 "Апта: "+
 new Date(data.weekly.start).toLocaleDateString("kk-KZ")+
 " — "+
 new Date(data.weekly.end).toLocaleDateString("kk-KZ");
}

function addText(parent,text){
 const p=document.createElement("p");
 p.textContent=text;
 parent.appendChild(p);
}

function renderOrders(orders,containerId,emptyText){
 const container=document.getElementById(containerId);
 container.innerHTML="";

 if(!Array.isArray(orders)||!orders.length){
  container.textContent=emptyText;
  return;
 }

 orders.forEach(order=>{
  const item=document.createElement("div");
  item.className="order";

  const name=order.passenger_name || "Жолаушы";
  const car=order.car_class || "Көрсетілмеген";

  const heading=document.createElement("h4");
  heading.textContent="🚕 "+name;
  item.appendChild(heading);

  addText(item,"📍 Қайдан: "+(order.pickup_address||"Көрсетілмеген"));
  addText(item,"🏁 Қайда: "+(order.destination_address||"Көрсетілмеген"));
  addText(item,"🚘 Класс: "+car);
  addText(item,"📏 Қашықтық: "+(order.distance_km||"—")+" км");
  addText(item,"💰 Бағасы: "+money(order.price));

  const time=document.createElement("div");
  time.className="order-time";

  if(order.order_date && order.order_time){
   time.textContent=
    "📅 Тапсырыс күні: "+order.order_date+
    "\n🕒 Тапсырыс уақыты: "+order.order_time;
   time.style.whiteSpace="pre-line";
  }else{
   time.textContent="📅 Тапсырыс уақыты көрсетілмеген";
  }

  item.appendChild(time);

  addText(item,"💳 Төлем: "+(order.payment_method||"Көрсетілмеген"));
  addText(item,"Мәртебесі: "+(order.status||""));

  container.appendChild(item);
 });
}

async function loadOrders(){
 const data=await api("/api/driver-orders");

 renderOrders(
  data.new_orders,
  "newOrders",
  "Әзірге жаңа тапсырыс жоқ"
 );

 renderOrders(
  data.my_orders,
  "myOrders",
  "Әзірге сапар жоқ"
 );
}

async function loadAll(){
 const button=document.getElementById("refresh");
 const message=document.getElementById("message");

 button.disabled=true;
 message.className="muted";
 message.textContent="Жүктелуде...";

 try{
  await Promise.all([loadStats(),loadOrders()]);
  message.textContent="✅ Мәліметтер жаңартылды";
 }catch(error){
  message.textContent="❌ "+error.message;
  message.className="error";
 }finally{
  button.disabled=false;
 }
}

loadAll();
</script>
</body>
</html>
