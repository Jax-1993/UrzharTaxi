<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ҮРЖАР TAXI — Жүргізуші кабинеті</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --yellow:#ffcc00;--yellow-dark:#e5b800;
  --black:#101114;--green:#16bd79;--red:#e34b59;
  --gray-bg:#101522;--card:#1c2536;--card-light:#243045;
  --border:#2e3a52;--text-muted:#94a3b8;
}
body{
  margin:0;background:var(--gray-bg);color:#fff;
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#101114 0%,#1a1d24 100%);
  padding:18px 16px;text-align:center;
  border-bottom:3px solid var(--yellow);
  box-shadow:0 2px 12px rgba(0,0,0,0.3);
  position:relative;
}
header h2{
  margin:0;color:var(--yellow);font-size:20px;
  font-weight:900;letter-spacing:-0.5px;
}
header .subtitle{
  color:var(--text-muted);font-size:12px;
  margin-top:4px;font-weight:500;
}
.logout-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,0.08);color:#fff;
  border:1px solid rgba(255,255,255,0.15);
  padding:7px 12px;border-radius:9px;font-size:12px;
  font-weight:600;cursor:pointer;font-family:inherit;
  transition:background 0.2s;
}
.logout-btn:hover{background:rgba(255,255,255,0.15)}

main{max-width:680px;margin:auto;padding:16px}

/* CARDS */
.card{
  background:var(--card);border-radius:18px;
  padding:18px;margin:14px 0;
  border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
}
.card h3{
  margin:0 0 14px;color:var(--yellow);
  font-size:16px;font-weight:800;letter-spacing:-0.3px;
}
.card h4{
  color:#cbd5e1;margin:14px 0 8px;
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  background:linear-gradient(135deg,var(--card-light) 0%,#2a3650 100%);
  padding:14px;border-radius:13px;
  border:1px solid rgba(255,255,255,0.05);
}
.stat small{
  color:var(--text-muted);font-size:11px;
  font-weight:500;letter-spacing:0.3px;
  display:block;margin-bottom:6px;
}
.stat strong{
  display:block;font-size:22px;
  font-weight:800;letter-spacing:-0.5px;
}

/* WEEKLY */
.weekly-row{
  display:flex;justify-content:space-between;
  padding:9px 0;font-size:14px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.weekly-row:last-of-type{border-bottom:0}
.weekly-label{color:var(--text-muted)}
.weekly-value{font-weight:700}

/* BUTTONS */
button{
  font-family:inherit;border:0;cursor:pointer;
  transition:transform 0.15s,background 0.2s,box-shadow 0.2s;
}
button:active:not(:disabled){transform:scale(0.97)}
button:disabled{opacity:0.5;cursor:not-allowed}

.btn-accept{
  background:linear-gradient(135deg,#16bd79 0%,#19d995 100%);
  color:white;padding:12px 18px;border-radius:11px;
  font-weight:700;font-size:14px;
  box-shadow:0 3px 10px rgba(22,189,121,0.3);
  width:100%;margin-top:10px;
}
.btn-complete{
  background:linear-gradient(135deg,#ffcc00 0%,#ffdb4d 100%);
  color:#111;padding:12px 18px;border-radius:11px;
  font-weight:800;font-size:14px;
  box-shadow:0 3px 10px rgba(255,204,0,0.3);
  width:100%;margin-top:10px;
}
.btn-cancel{
  background:linear-gradient(135deg,#e34b59 0%,#f05a68 100%);
  color:white;padding:12px 18px;border-radius:11px;
  font-weight:700;font-size:14px;
  box-shadow:0 3px 10px rgba(227,75,89,0.3);
  width:100%;margin-top:8px;
}
.btn-refresh{
  background:linear-gradient(135deg,#2d3a52 0%,#3a4a66 100%);
  color:white;padding:13px 20px;border-radius:12px;
  font-weight:700;font-size:14px;width:100%;
}

/* ORDERS */
.order{
  background:linear-gradient(135deg,var(--card-light) 0%,#2a3650 100%);
  padding:14px;border-radius:13px;margin:10px 0;
  border:1px solid rgba(255,255,255,0.06);
  animation:fadeIn 0.25s ease;
}
.order-heading{
  color:#ffcc00;font-size:15px;
  font-weight:800;margin:0 0 8px;
}
.order-line{
  font-size:13px;line-height:1.7;
  margin:3px 0;color:#cbd5e1;
}
.order-time{
  background:linear-gradient(135deg,#1a3d30 0%,#1d493d 100%);
  border:1px solid #238b68;
  padding:10px;border-radius:9px;
  margin:10px 0;line-height:1.8;
  color:#8fffc8;font-size:12px;
  white-space:pre-line;font-weight:500;
}
.status-badge{
  display:inline-block;
  padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;
  letter-spacing:0.3px;
}
.status-searching{background:rgba(255,204,0,0.15);color:#ffcc00}
.status-accepted{background:rgba(22,189,121,0.15);color:#19d995}
.status-in_progress{background:rgba(96,165,250,0.15);color:#93c5fd}
.status-completed{background:rgba(148,163,184,0.15);color:#cbd5e1}

/* MESSAGES */
.muted{color:var(--text-muted);font-size:13px;line-height:1.5}
.error{color:#ff9999}
.success{color:#19d995}
#message{margin-top:12px;font-size:13px;text-align:center;font-weight:600}

/* EMPTY STATE */
.empty{
  background:rgba(255,255,255,0.03);
  padding:18px;border-radius:11px;
  text-align:center;color:var(--text-muted);
  font-size:13px;line-height:1.6;
  border:1px dashed rgba(255,255,255,0.1);
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:480px){
  main{padding:12px}
  .card{padding:15px}
  .stat strong{font-size:18px}
}
</style>
</head>
<body>

<header>
  <h2>🚕 ҮРЖАР TAXI</h2>
  <div class="subtitle">Жүргізуші кабинеті</div>
  <button class="logout-btn" onclick="logout()">Шығу</button>
</header>

<main>

<!-- СТАТИСТИКА -->
<div class="card">
  <h3>📊 Менің статистикам</h3>
  <div class="stats">
    <div class="stat"><small>Орындалған сапар</small><strong id="rides">—</strong></div>
    <div class="stat"><small>Жалпы айналым</small><strong id="gross">—</strong></div>
    <div class="stat"><small>Жүргізуші табысы</small><strong id="earning">—</strong></div>
    <div class="stat"><small>10% комиссия</small><strong id="commission">—</strong></div>
  </div>
</div>

<!-- АПТАЛЫҚ КОМИССИЯ -->
<div class="card">
  <h3>📅 Апталық комиссия</h3>
  <div class="weekly-row">
    <span class="weekly-label">Төленбеген</span>
    <span class="weekly-value" id="unpaid" style="color:#ffcc00">—</span>
  </div>
  <div class="weekly-row">
    <span class="weekly-label">Төленген</span>
    <span class="weekly-value" id="paid" style="color:#19d995">—</span>
  </div>
  <p class="muted" id="week" style="margin-top:12px"></p>
</div>

<!-- ЖАҢА ТАПСЫРЫСТАР -->
<div class="card">
  <h3>🟢 Жаңа тапсырыстар</h3>
  <div id="newOrders" class="muted">Тапсырыстар жүктелуде...</div>
</div>

<!-- МЕНІҢ САПАРЛАРЫМ -->
<div class="card">
  <h3>📋 Менің сапарларым</h3>
  <div id="myOrders" class="muted">Жүктелуде...</div>
</div>

<!-- ЖАҢАРТУ -->
<div class="card" style="background:transparent;border:0;box-shadow:none;padding:0;margin-top:8px">
  <button class="btn-refresh" onclick="loadAll()" id="refresh">🔄 Жаңарту</button>
  <p id="message" class="muted"></p>
</div>

</main>

<script>
const money = n => Number(n || 0).toLocaleString("kk-KZ") + " ₸";

async function api(url, options = {}) {
  const response = await fetch(url, {
    credentials: "include",
    ...options
  });

  if (response.status === 401 || response.status === 403) {
    window.location.href = "/driver-login.html";
    throw new Error("Сессия аяқталды");
  }

  const data = await response.json();
  if (!response.ok || data.success === false) {
    throw new Error(data.message || "Қате орын алды");
  }
  return data;
}

async function loadStats() {
  const data = await api("/api/driver-stats");
  document.getElementById("rides").textContent = data.ridesCount;
  document.getElementById("gross").textContent = money(data.grossTotal);
  document.getElementById("earning").textContent = money(data.driverEarning);
  document.getElementById("commission").textContent = money(data.commissionTotal);
  document.getElementById("unpaid").textContent = money(data.weekly.unpaid);
  document.getElementById("paid").textContent = money(data.weekly.paid);
  document.getElementById("week").textContent =
    "Апта: " +
    new Date(data.weekly.start).toLocaleDateString("kk-KZ") +
    " — " +
    new Date(data.weekly.end).toLocaleDateString("kk-KZ");
}

const STATUS_LABELS = {
  searching: "🔍 Ізделуде",
  accepted: "✅ Қабылданды",
  in_progress: "🚕 Жолда",
  completed: "🏁 Аяқталды"
};

function renderOrder(order, containerId, isMyOrder) {
  const item = document.createElement("div");
  item.className = "order";

  const name = order.passenger_name || "Жолаушы";
  const car = order.car_class || "—";
  const carLabel = car === "economy" ? "Эконом" : car === "comfort" ? "Бизнес" : car === "comfort_plus" ? "Бизнес+" : car;

  // Тақырып
  const heading = document.createElement("h4");
  heading.className = "order-heading";
  heading.textContent = "🚕 " + name;
  item.appendChild(heading);

  // Мәртебе badge
  if (order.status) {
    const badge = document.createElement("span");
    badge.className = "status-badge status-" + order.status;
    badge.textContent = STATUS_LABELS[order.status] || order.status;
    item.appendChild(badge);
  }

  // Мекенжайлар
  const info = document.createElement("div");
  info.style.marginTop = "8px";
  info.innerHTML = `
    <div class="order-line">📍 Қайдан: ${escapeHtml(order.pickup_address || "—")}</div>
    <div class="order-line">🏁 Қайда: ${escapeHtml(order.destination_address || "—")}</div>
    <div class="order-line">🚘 Класс: ${escapeHtml(carLabel)}</div>
    <div class="order-line">📏 Қашықтық: ${order.distance_km || "—"} км</div>
    <div class="order-line">💰 Бағасы: <b style="color:#ffcc00">${money(order.price)}</b></div>
  `;
  item.appendChild(info);

  // Жүргізушіге: жолаушы телефоны
  if (isMyOrder && order.passenger_phone) {
    const phoneLine = document.createElement("div");
    phoneLine.className = "order-line";
    phoneLine.innerHTML = `📞 Телефон: <a href="tel:${escapeHtml(order.passenger_phone)}" style="color:#19d995;text-decoration:none;font-weight:600">${escapeHtml(order.passenger_phone)}</a>`;
    item.appendChild(phoneLine);
  }

  // Уақыт
  if (order.order_date && order.order_time) {
    const time = document.createElement("div");
    time.className = "order-time";
    time.textContent = "📅 " + order.order_date + "\n🕒 " + order.order_time;
    item.appendChild(time);
  }

  // Төлем
  if (order.payment_method) {
    const pay = document.createElement("div");
    pay.className = "order-line";
    const payLabel = order.payment_method === "cash" ? "Қолма-қол" : order.payment_method;
    pay.textContent = "💳 Төлем: " + payLabel;
    item.appendChild(pay);
  }

  // ===== БАТЫРМАЛАР =====
  if (!isMyOrder) {
    // Жаңа тапсырыс → Қабылдау
    const acceptBtn = document.createElement("button");
    acceptBtn.className = "btn-accept";
    acceptBtn.textContent = "✅ ҚАБЫЛДАУ";
    acceptBtn.onclick = () => acceptOrder(order.id, acceptBtn);
    item.appendChild(acceptBtn);
  } else {
    // Менің сапарым
    if (order.status === "accepted" || order.status === "in_progress") {
      const completeBtn = document.createElement("button");
      completeBtn.className = "btn-complete";
      completeBtn.textContent = "🏁 САПАРДЫ АЯҚТАУ";
      completeBtn.onclick = () => completeOrder(order.id, completeBtn);
      item.appendChild(completeBtn);

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "btn-cancel";
      cancelBtn.textContent = "❌ БАС ТАРТУ";
      cancelBtn.onclick = () => cancelOrder(order.id, cancelBtn);
      item.appendChild(cancelBtn);
    }
  }

  const container = document.getElementById(containerId);
  if (container.firstElementChild?.classList.contains("muted") ||
      container.firstElementChild?.classList.contains("empty")) {
    container.innerHTML = "";
  }
  container.appendChild(item);
}

function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

async function loadOrders() {
  const data = await api("/api/driver-orders");

  const newBox = document.getElementById("newOrders");
  const myBox = document.getElementById("myOrders");

  newBox.innerHTML = "";
  myBox.innerHTML = "";

  const newOrders = Array.isArray(data.new_orders) ? data.new_orders : [];
  const myOrders = Array.isArray(data.my_orders) ? data.my_orders : [];

  if (!newOrders.length) {
    newBox.innerHTML = '<div class="empty">Әзірге жаңа тапсырыс жоқ</div>';
  } else {
    newOrders.forEach(o => renderOrder(o, "newOrders", false));
  }

  if (!myOrders.length) {
    myBox.innerHTML = '<div class="empty">Әзірге белсенді сапар жоқ</div>';
  } else {
    myOrders.forEach(o => renderOrder(o, "myOrders", true));
  }
}

async function acceptOrder(orderId, btn) {
  if (!confirm("Осы тапсырысты қабылдайсыз ба?")) return;

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Қабылдануда...";
  showMessage("Тапсырыс қабылдануда...", "");

  try {
    const r = await fetch("/api/driver-accept", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId })
    });
    const d = await r.json();

    if (r.status === 401) { window.location.href = "/driver-login.html"; return; }

    if (!r.ok || !d.success) throw new Error(d.message || "Қабылдау мүмкін болмады");

    showMessage("✅ Тапсырыс сізге бекітілді!", "success");
    await loadAll();

  } catch (e) {
    showMessage("❌ " + e.message, "error");
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function completeOrder(orderId, btn) {
  if (!confirm("Сапарды аяқталды деп белгілейсіз бе?")) return;

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Аяқталуда...";
  showMessage("Сапар аяқталуда...", "");

  try {
    const r = await fetch("/api/driver-complete", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId })
    });
    const d = await r.json();

    if (r.status === 401) { window.location.href = "/driver-login.html"; return; }

    if (!r.ok || !d.success) throw new Error(d.message || "Аяқтау мүмкін болмады");

    showMessage(
      `✅ Сапар аяқталды! Табыс: ${money(d.driverEarning)} • Комиссия: ${money(d.commission)}`,
      "success"
    );
    await loadAll();

  } catch (e) {
    showMessage("❌ " + e.message, "error");
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function cancelOrder(orderId, btn) {
  if (!confirm("Тапсырыстан бас тартасыз ба? Бұл әрекетті кері қайтару мүмкін емес.")) return;

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Бас тартылуда...";
  showMessage("Бас тартылуда...", "");

  try {
    const r = await fetch("/api/driver-cancel", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId })
    });
    const d = await r.json();

    if (r.status === 401) { window.location.href = "/driver-login.html"; return; }

    if (!r.ok || !d.success) throw new Error(d.message || "Бас тарту мүмкін болмады");

    showMessage("✅ Тапсырыстан бас тартылды", "success");
    await loadAll();

  } catch (e) {
    showMessage("❌ " + e.message, "error");
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function showMessage(text, className) {
  const m = document.getElementById("message");
  m.textContent = text;
  m.className = className || "muted";
}

async function logout() {
  if (!confirm("Жүйеден шығасыз ба?")) return;
  try {
    await fetch("/api/driver-logout", { credentials: "include" });
  } catch (e) {}
  window.location.href = "/driver-login.html";
}

async function loadAll() {
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  showMessage("Жүктелуде...", "muted");

  try {
    await Promise.all([loadStats(), loadOrders()]);
    showMessage("✅ Мәліметтер жаңартылды", "success");
    // 3 секундтан кейін «Мәліметтер жаңартылды»-ны өшіру
    setTimeout(() => {
      const m = document.getElementById("message");
      if (m.textContent === "✅ Мәліметтер жаңартылды") {
        m.textContent = "";
        m.className = "muted";
      }
    }, 3000);
  } catch (e) {
    if (e.message !== "Сессия аяқталды") {
      showMessage("❌ " + e.message, "error");
    }
  } finally {
    btn.disabled = false;
  }
}

// Автоматты жаңарту — әр 30 секунд сайын
let autoRefreshTimer = null;
function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => {
    // Тек жаңа тапсырыстар мен мои сапарлары жаңарады (статистика емес)
    loadOrders().catch(() => {});
  }, 30000);
}

window.addEventListener("pagehide", () => {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
});

loadAll().then(() => startAutoRefresh());
</script>

</body>
</html>
