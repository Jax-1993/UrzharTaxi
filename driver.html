<!-- Тек скрипт бөлігіндегі өзгерістерді көрсетемін, қалғаны сол күйінде қалады -->
<!-- Бұл кодты driver.html файлының <body> ішіне, ең жоғарыға, <header>-ден кейін қосыңыз -->

<div style="padding: 10px 14px; background: #1c2536; border-bottom: 1px solid #2e3a52; display: flex; justify-content: space-between; align-items: center;">
  <div style="font-weight: 700; color: #fff;">Желідегі мәртебе:</div>
  <button id="onlineToggleBtn" onclick="toggleOnlineMode()" style="background: #e34b59; color: white; border: 0; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s;">🔴 ЖЕЛІДЕ ЕМЕС</button>
</div>

<script>
// ... (барлық бұрынғы скрипт кодтары сақталады) ...

let isOnline = false;
let onlineWatchId = null;

async function toggleOnlineMode() {
  isOnline = !isOnline;
  const btn = document.getElementById('onlineToggleBtn');

  if (isOnline) {
    btn.style.background = '#16bd79';
    btn.textContent = '🟢 ЖЕЛІДЕ';
    
    // Серверге желіде екенін айту
    await fetch("/api/driver?action=toggle_online", {
      method: "POST", credentials: "include", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ is_online: true })
    });

    // GPS-ті үнемі жіберіп тұру
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => sendOnlineLocation(pos), null, { enableHighAccuracy: true });
      onlineWatchId = navigator.geolocation.watchPosition(pos => sendOnlineLocation(pos), null, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
    }
  } else {
    btn.style.background = '#e34b59';
    btn.textContent = '🔴 ЖЕЛІДЕ ЕМЕС';
    
    if (onlineWatchId) {
      navigator.geolocation.clearWatch(onlineWatchId);
      onlineWatchId = null;
    }

    // Серверге желіден шыққанын айту
    await fetch("/api/driver?action=toggle_online", {
      method: "POST", credentials: "include", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ is_online: false })
    });
  }
}

// Әр 15 секунд сайын орнын жаңарту
let lastOnlineSent = 0;
async function sendOnlineLocation(pos) {
  if (!isOnline) return;
  const now = Date.now();
  if (now - lastOnlineSent < 15000) return;
  lastOnlineSent = now;

  await fetch("/api/driver?action=update_location", {
    method: "POST", credentials: "include", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ latitude: pos.coords.latitude, longitude: pos.coords.longitude })
  });
}
</script>
