<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ҮРЖАР TAXI — Жүргізушіні бақылау</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --yellow:#ffcc00;--green:#16bd79;--red:#e34b59;
  --black:#101114;--gray-bg:#101522;--card:#1c2536;
  --border:#2e3a52;--text-muted:#94a3b8;
}
body{
  margin:0;background:var(--gray-bg);color:#fff;
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#101114 0%,#1a1d24 100%);
  padding:16px;text-align:center;
  border-bottom:3px solid var(--yellow);
  position:sticky;top:0;z-index:100;
}
header h2{
  margin:0;color:var(--yellow);font-size:19px;
  font-weight:900;letter-spacing:-0.5px;
}
header .subtitle{
  color:var(--text-muted);font-size:12px;
  margin-top:3px;font-weight:500;
}

main{max-width:680px;margin:auto;padding:14px}

/* STATUS CARD */
.status-card{
  background:var(--card);border-radius:18px;
  padding:18px;margin-bottom:14px;
  border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
}
.status-title{
  font-size:13px;color:var(--text-muted);
  font-weight:600;letter-spacing:0.3px;
  text-transform:uppercase;margin-bottom:10px;
}
.status-current{
  font-size:22px;font-weight:900;
  margin-bottom:14px;letter-spacing:-0.5px;
}

/* STATUS PROGRESS */
.progress{
  display:flex;gap:6px;margin-bottom:14px;
}
.progress-step{
  flex:1;height:5px;border-radius:3px;
  background:rgba(255,255,255,0.1);
  transition:background 0.4s;
}
.progress-step.active{background:var(--yellow)}
.progress-step.done{background:var(--green)}

/* STATUS MESSAGE */
.status-message{
  padding:14px;border-radius:12px;
  background:rgba(255,204,0,0.08);
  border:1px solid rgba(255,204,0,0.2);
  color:#ffdb4d;font-size:14px;
  line-height:1.5;font-weight:500;
}
.status-message.success{
  background:rgba(22,189,121,0.1);
  border-color:rgba(22,189,121,0.3);
  color:#19d995;
}
.status-message.error{
  background:rgba(227,75,89,0.1);
  border-color:rgba(227,75,89,0.3);
  color:#f05a68;
}

/* LOADING ANIMATION */
.loading-dots{display:inline-flex;gap:4px;margin-left:8px}
.loading-dots span{
  width:6px;height:6px;border-radius:50%;
  background:currentColor;animation:blink 1.4s infinite;
}
.loading-dots span:nth-child(2){animation-delay:0.2s}
.loading-dots span:nth-child(3){animation-delay:0.4s}
@keyframes blink{
  0%,80%,100%{opacity:0.3}
  40%{opacity:1}
}

/* MAP */
.map-container{
  background:var(--card);border-radius:18px;
  padding:8px;margin-bottom:14px;
  border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
  overflow:hidden;
}
#map{
  width:100%;height:380px;border-radius:13px;
  background:#1a2536;
}

/* INFO CARD */
.info-card{
  background:var(--card);border-radius:18px;
  padding:18px;margin-bottom:14px;
  border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
}
.info-card h3{
  margin:0 0 14px;color:var(--yellow);
  font-size:15px;font-weight:800;
}
.info-row{
  display:flex;justify-content:space-between;
  padding:9px 0;font-size:13px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.info-row:last-child{border-bottom:0}
.info-label{color:var(--text-muted)}
.info-value{font-weight:700;text-align:right;max-width:60%}

/* ACTION BUTTONS */
.action-card{
  background:var(--card);border-radius:18px;
  padding:18px;margin-bottom:14px;
  border:1px solid var(--border);
}
.btn{
  width:100%;padding:15px;border-radius:13px;
  font-weight:800;font-size:15px;font-family:inherit;
  border:0;cursor:pointer;
  transition:transform 0.15s,opacity 0.2s,box-shadow 0.2s;
}
.btn:active:not(:disabled){transform:scale(0.97)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-cancel{
  background:linear-gradient(135deg,#e34b59 0%,#f05a68 100%);
  color:white;
  box-shadow:0 3px 12px rgba(227,75,89,0.3);
}
.btn-cancel:hover:not(:disabled){box-shadow:0 5px 18px rgba(227,75,89,0.4)}
.btn-home{
  background:linear-gradient(135deg,#2d3a52 0%,#3a4a66 100%);
  color:white;margin-top:10px;
}

/* UPDATED TIME */
.updated{
  text-align:center;color:var(--text-muted);
  font-size:11px;margin-top:10px;
}

/* FULLSCREEN MESSAGE (no session) */
.fullscreen-msg{
  text-align:center;padding:60px 20px;
}
.fullscreen-msg h2{
  color:var(--yellow);font-size:22px;margin-bottom:12px;
}
.fullscreen-msg p{
  color:var(--text-muted);font-size:14px;
  line-height:1.6;margin-bottom:20px;
}
.fullscreen-msg a{
  display:inline-block;background:var(--yellow);
  color:#111;padding:14px 28px;border-radius:12px;
  font-weight:800;text-decoration:none;font-size:15px;
}

/* CANCEL CONFIRM MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.7);z-index:9999;
  backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--card);border-radius:18px;
  padding:24px;max-width:400px;width:100%;
  border:1px solid var(--border);
  animation:scaleIn 0.2s ease;
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(0.9)}
  to{opacity:1;transform:scale(1)}
}
.modal h3{
  margin:0 0 10px;font-size:18px;
  font-weight:900;color:#fff;
}
.modal p{
  color:var(--text-muted);font-size:14px;
  line-height:1.6;margin-bottom:20px;
}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1;padding:13px}

@media(max-width:480px){
  main{padding:11px}
  .status-current{font-size:19px}
  #map{height:320px}
}
</style>
</head>
<body>

<header>
  <h2>🚕 ҮРЖАР TAXI</h2>
  <div class="subtitle">Жүргізушіні бақылау</div>
</header>

<main id="app">

  <!-- СТАТУС -->
  <div class="status-card" id="statusCard">
    <div class="status-title">Тапсырыс күйі</div>
    <div class="status-current" id="statusText">Жүктелуде...</div>
    <div class="progress">
      <div class="progress-step" id="step1"></div>
      <div class="progress-step" id="step2"></div>
      <div class="progress-step" id="step3"></div>
      <div class="progress-step" id="step4"></div>
    </div>
    <div class="status-message" id="statusMessage">
      Жүйеге қосылуда...
    </div>
  </div>

  <!-- КАРТА -->
  <div class="map-container">
    <div id="map"></div>
  </div>

  <!-- АҚПАРАТ -->
  <div class="info-card" id="infoCard" style="display:none">
    <h3>📋 Тапсырыс ақпараты</h3>
    <div class="info-row">
      <span class="info-label">📍 Қайдан</span>
      <span class="info-value" id="pickupAddr">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">🏁 Қайда</span>
      <span class="info-value" id="destAddr">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">🚘 Класс</span>
      <span class="info-value" id="carClass">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">💰 Бағасы</span>
      <span class="info-value" id="price" style="color:#ffcc00">—</span>
    </div>
  </div>

  <!-- БАС ТАРТУ -->
  <div class="action-card" id="actionCard" style="display:none">
    <button class="btn btn-cancel" id="cancelBtn" onclick="openCancelModal()">
      ❌ САПАРДАН БАС ТАРТУ
    </button>
    <button class="btn btn-home" onclick="goHome()">
      🏠 Басты бетке
    </button>
    <div class="updated" id="updatedText"></div>
  </div>

</main>

<!-- CANCEL MODAL -->
<div class="modal-overlay" id="cancelModal">
  <div class="modal">
    <h3>❌ Бас тарту</h3>
    <p>Сапардан бас тартқыңыз келе ме? Бұл әрекетті кері қайтару мүмкін емес.</p>
    <div class="modal-actions">
      <button class="btn btn-home" onclick="closeCancelModal()">Жоқ</button>
      <button class="btn btn-cancel" id="confirmCancelBtn" onclick="confirmCancel()">
        Иә, бас тарту
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const ORDER_ID = sessionStorage.getItem("urzhar_taxi_order_id");
const TRACKING_TOKEN = sessionStorage.getItem("urzhar_taxi_tracking_token");

let map, driverMarker, pickupMarker, routeLine;
let currentStatus = null;
let pollTimer = null;
let isProcessing = false;

// ===== STATUS LABELS =====
const STATUS_CONFIG = {
  searching: {
    label: "🔍 Жүргізуші ізделуде",
    message: "Жүргізуші табылуда. Күте тұрыңыз...",
    step: 1, className: ""
  },
  accepted: {
    label: "✅ Жүргізуші тағайындалды",
    message: "Жүргізуші сізге бара жатыр. Картадан бақылаңыз.",
    step: 2, className: "success"
  },
  in_progress: {
    label: "🚕 Сапар басталды",
    message: "Сіз жолдасыз. Аман-есен жетіңіз!",
    step: 3, className: "success"
  },
  completed: {
    label: "🏁 Сапар аяқталды",
    message: "Сапар сәтті аяқталды. Рахмет!",
    step: 4, className: "success"
  },
  cancelled: {
    label: "❌ Тапсырыс тоқтатылды",
    message: "Бұл тапсырыс тоқтатылды.",
    step: 0, className: "error"
  }
};

// ===== INIT =====
document.addEventListener("DOMContentLoaded", () => {
  if (!ORDER_ID || !TRACKING_TOKEN) {
    showNoSession();
    return;
  }

  initMap();
  loadStatus();
  pollTimer = setInterval(loadStatus, 5000);
});

window.addEventListener("pagehide", () => {
  if (pollTimer) clearInterval(pollTimer);
});

// ===== NO SESSION =====
function showNoSession() {
  document.getElementById("app").innerHTML = `
    <div class="fullscreen-msg">
      <h2>📱 Тапсырыс табылмады</h2>
      <p>Бұл бетке кіру үшін алдымен такси шақырыңыз.<br>
      Егер тапсырыс берген болсаңыз, басты бетке қайта кіріңіз.</p>
      <a href="/index.html">🏠 Басты бетке өту</a>
    </div>
  `;
}

// ===== MAP =====
function initMap() {
  map = L.map("map", { zoomControl: true }).setView([47.09, 81.63], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
  }).addTo(map);
}

// ===== STATUS LOAD =====
async function loadStatus() {
  if (!ORDER_ID || !TRACKING_TOKEN) return;

  try {
    const r = await fetch("/api/passenger?action=status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId: ORDER_ID, trackingToken: TRACKING_TOKEN })
    });

    const d = await r.json();

    if (!r.ok || !d.success) {
      if (r.status === 404) {
        showNoSession();
      }
      return;
    }

    updateOrderInfo(d.order);
    updateStatusUI(d.order.status);

    // GPS tracking (тек accepted/in_progress)
    if (d.order.status === "accepted" || d.order.status === "in_progress") {
      await loadDriverLocation();
    }
  } catch (e) {
    console.error("Status error:", e);
  }
}

// ===== UPDATE ORDER INFO =====
function updateOrderInfo(order) {
  if (!order) return;

  const infoCard = document.getElementById("infoCard");
  const actionCard = document.getElementById("actionCard");

  if (order.pickup_address) {
    infoCard.style.display = "block";
    actionCard.style.display = "block";
  }

  document.getElementById("pickupAddr").textContent = order.pickup_address || "—";
  document.getElementById("destAddr").textContent = order.destination_address || "—";

  const carLabels = { economy: "Эконом", comfort: "Бизнес", comfort_plus: "Бизнес+" };
  document.getElementById("carClass").textContent = carLabels[order.car_class] || order.car_class || "—";
  document.getElementById("price").textContent =
    Number(order.price || 0).toLocaleString("kk-KZ") + " ₸";

  // Pickup marker (бір рет)
  if (order.pickup_address && !pickupMarker && map) {
    const lat = Number(order.pickup_latitude);
    const lng = Number(order.pickup_longitude);
    if (Number.isFinite(lat) && Number.isFinite(lng)) {
      pickupMarker = L.marker([lat, lng], {
        icon: L.divIcon({
          className: "custom-pickup",
          html: '<div style="background:#ffcc00;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        })
      }).addTo(map).bindPopup("📍 Сіз осындасыз");
    }
  }
}

// ===== UPDATE STATUS UI =====
function updateStatusUI(status) {
  if (currentStatus === status) return;
  currentStatus = status;

  const cfg = STATUS_CONFIG[status] || STATUS_CONFIG.searching;

  const statusText = document.getElementById("statusText");
  const statusMessage = document.getElementById("statusMessage");

  statusText.textContent = cfg.label;

  // Loading dots (тек searching)
  if (status === "searching") {
    statusMessage.innerHTML = cfg.message +
      '<span class="loading-dots"><span></span><span></span><span></span></span>';
  } else {
    statusMessage.textContent = cfg.message;
  }

  statusMessage.className = "status-message " + cfg.className;

  // Progress steps
  for (let i = 1; i <= 4; i++) {
    const step = document.getElementById("step" + i);
    step.className = "progress-step";
    if (i < cfg.step) step.classList.add("done");
    if (i === cfg.step) step.classList.add("active");
  }

  // Cancel button visibility (тек searching/accepted)
  const cancelBtn = document.getElementById("cancelBtn");
  if (status === "completed" || status === "cancelled") {
    cancelBtn.style.display = "none";
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  } else {
    cancelBtn.style.display = "block";
  }
}

// ===== DRIVER LOCATION =====
async function loadDriverLocation() {
  try {
    const r = await fetch("/api/passenger?action=location", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId: ORDER_ID, trackingToken: TRACKING_TOKEN })
    });

    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      if (r.status === 403) {
        document.getElementById("statusMessage").textContent =
          "⏳ Жүргізуші GPS бөлісуді бастағанша күте тұрыңыз...";
      }
      return;
    }

    const d = await r.json();
    if (!d.success || !d.driverLocation) return;

    const { latitude, longitude, updatedAt } = d.driverLocation;
    const point = [Number(latitude), Number(longitude)];

    if (!Number.isFinite(point[0]) || !Number.isFinite(point[1])) return;

    if (!driverMarker) {
      driverMarker = L.marker(point, {
        icon: L.divIcon({
          className: "custom-driver",
          html: '<div style="font-size:32px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5))">🚕</div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        })
      }).addTo(map).bindPopup("🚕 Жүргізуші");
    } else {
      driverMarker.setLatLng(point);
    }

    // Auto-zoom: driver + pickup көрінетіндей
    const bounds = L.latLngBounds([point]);
    if (pickupMarker) bounds.extend(pickupMarker.getLatLng());
    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });

    // Updated time
    const upd = document.getElementById("updatedText");
    if (updatedAt) {
      const t = new Date(updatedAt).toLocaleTimeString("kk-KZ", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
      upd.textContent = "🔄 GPS жаңартылды: " + t;
    }
  } catch (e) {
    console.error("Location error:", e);
  }
}

// ===== CANCEL MODAL =====
function openCancelModal() {
  document.getElementById("cancelModal").classList.add("open");
}

function closeCancelModal() {
  document.getElementById("cancelModal").classList.remove("open");
}

async function confirmCancel() {
  if (isProcessing) return;
  isProcessing = true;

  const btn = document.getElementById("confirmCancelBtn");
  btn.disabled = true;
  btn.textContent = "Бас тартылуда...";

  try {
    const r = await fetch("/api/passenger?action=cancel", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId: ORDER_ID, trackingToken: TRACKING_TOKEN })
    });
    const d = await r.json();

    if (!r.ok || !d.success) {
      throw new Error(d.message || "Бас тарту мүмкін болмады");
    }

    closeCancelModal();
    updateStatusUI("cancelled");
    document.getElementById("statusMessage").textContent =
      "✅ Тапсырыстан бас тартылды. Рахмет!";

    // 3 секундтан кейін басты бетке
    setTimeout(() => {
      sessionStorage.removeItem("urzhar_taxi_order_id");
      sessionStorage.removeItem("urzhar_taxi_tracking_token");
      window.location.href = "/index.html";
    }, 3000);

  } catch (e) {
    document.getElementById("statusMessage").textContent = "❌ " + e.message;
    document.getElementById("statusMessage").className = "status-message error";
    btn.disabled = false;
    btn.textContent = "Иә, бас тарту";
  } finally {
    isProcessing = false;
  }
}

function goHome() {
  window.location.href = "/index.html";
}
</script>

</body>
</html>
