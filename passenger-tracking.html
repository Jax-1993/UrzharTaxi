<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ҮРЖАР TAXI — Бақылау</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#101522;color:#fff;font-family:'Inter',sans-serif;min-height:100dvh}
header{background:#ffd400;color:#111;padding:18px;text-align:center;font-weight:900;font-size:20px;border-bottom:2px solid #e5b800}
main{max-width:650px;margin:auto;padding:16px}
.card{background:#1c2536;padding:18px;border-radius:14px;margin-bottom:15px;border:1px solid #2e3a52}
h2{margin:0 0 12px;font-size:18px;color:#ffcc00}
.status{padding:12px;background:#243045;border-radius:9px;line-height:1.5;margin:12px 0;font-weight:600;text-align:center}
.status.searching{color:#ffcc00}
.status.accepted{color:#19d995}
#map{width:100%;height:350px;border-radius:12px;background:#1a2536;margin-top:10px}
button{width:100%;border:0;border-radius:10px;padding:15px;margin-top:10px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-cancel{background:#e54848;color:white}
.btn-home{background:#2d3a52;color:white}
.small{color:#c5cede;font-size:13px;line-height:1.5;text-align:center;margin-top:10px}

/* КҮТУ ТАЙМЕРІ ҮШІН */
.wait-timer-box {
  background: linear-gradient(135deg, #2a1a1a 0%, #3a1f1f 100%);
  border: 2px solid #e54848;
  border-radius: 14px;
  padding: 20px;
  margin: 15px 0;
  text-align: center;
  display: none;
  animation: pulse 1.5s infinite;
}
.wait-timer-box.free {
  background: linear-gradient(135deg, #1a3d30 0%, #1d493d 100%);
  border-color: #16bd79;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}
.wait-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
.wait-timer { font-size: 36px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; margin: 10px 0; }
.wait-desc { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
.wait-fee-text { font-size: 20px; font-weight: 800; color: #ffcc00; margin-top: 10px; display: none; }
</style>
</head>
<body>
<header>🚕 TULPAR TAXI — БАҚЫЛАУ</header>
<main>
  <div class="card">
    <h2>📍 Жүргізушіні бақылау</h2>
    <div id="status" class="status searching">Жүйеге қосылуда...</div>
    
    <!-- КҮТУ ТАЙМЕРІ -->
    <div id="waitTimerBox" class="wait-timer-box">
      <div class="wait-title">🚕 Жүргізуші келді!</div>
      <div class="wait-timer" id="waitTimer">05:00</div>
      <div class="wait-desc" id="waitDesc">5 минут тегін күту уақыты.</div>
      <div class="wait-fee-text" id="waitFeeText">Күту ақысы: 0 ₸</div>
    </div>
    <!-- =================== -->

    <div id="map"></div>
    <p class="small" id="updated">GPS дерегі күтілуде...</p>
  </div>
  
  <div class="card" id="cancelCard" style="display:none">
    <button class="btn-cancel" onclick="cancelOrder()">❌ САПАРДАН БАС ТАРТУ</button>
    <button class="btn-home" onclick="window.location.href='/index.html'">🏠 Басты бетке</button>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const orderId = sessionStorage.getItem("urzhar_taxi_order_id");
const token = sessionStorage.getItem("urzhar_taxi_tracking_token");
let map, driverMarker, pollTimer;
let waitInterval = null;
let arrivedTime = null;

function initMap() {
  const savedLat = localStorage.getItem('passenger_last_lat');
  const savedLng = localStorage.getItem('passenger_last_lng');
  const initialCoords = (savedLat && savedLng) ? [Number(savedLat), Number(savedLng)] : [48.0196, 66.9237];
  const initialZoom = (savedLat && savedLng) ? 14 : 5;

  map = L.map("map").setView(initialCoords, initialZoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
}

async function checkStatus() {
  if (!orderId || !token) {
    document.getElementById("status").textContent = "Тапсырыс табылмады. Басты бетке оралыңыз.";
    return;
  }
  
  try {
    const r = await fetch("/api/passenger?action=status", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, trackingToken: token })
    });
    const d = await r.json();
    if (!d.success) return;

    const st = document.getElementById("status");
    document.getElementById("cancelCard").style.display = "block";

    // Жүргізуші келгенін тексеру
    if (d.order.driver_arrived_at && !arrivedTime && d.order.status !== 'completed') {
      arrivedTime = new Date(d.order.driver_arrived_at).getTime();
      startWaitTimer();
    }

    if (d.order.status === "searching") {
      st.className = "status searching";
      st.innerHTML = "🔍 Жүргізуші ізделуде...";
    } else if (d.order.status === "accepted") {
      st.className = "status accepted";
      st.innerHTML = "✅ Жүргізуші тағайындалды! Жолда...";
      loadLocation();
    } else if (d.order.status === "in_progress") {
      st.className = "status accepted";
      st.innerHTML = "🚕 Сапар басталды!";
      document.getElementById("waitTimerBox").style.display = "none"; // Таймерді жасыру
      if(waitInterval) clearInterval(waitInterval);
      loadLocation();
    } else if (d.order.status === "completed") {
      st.className = "status accepted";
      st.innerHTML = "🏁 Сапар аяқталды. Рахмет!";
      document.getElementById("cancelCard").style.display = "none";
      document.getElementById("waitTimerBox").style.display = "none";
      if(waitInterval) clearInterval(waitInterval);
      clearInterval(pollTimer);
    } else if (d.order.status === "cancelled") {
      st.className = "status searching";
      st.innerHTML = "❌ Тапсырыс тоқтатылды";
      document.getElementById("cancelCard").style.display = "none";
      document.getElementById("waitTimerBox").style.display = "none";
      if(waitInterval) clearInterval(waitInterval);
      clearInterval(pollTimer);
    }
  } catch (e) {}
}

function startWaitTimer() {
  document.getElementById("waitTimerBox").style.display = "block";
  document.getElementById("waitTimerBox").classList.add("free");
  
  if (waitInterval) clearInterval(waitInterval);
  
  waitInterval = setInterval(() => {
    const now = Date.now();
    const diffSecs = Math.floor((now - arrivedTime) / 1000);
    const freeSecs = 5 * 60; // 5 минут = 300 секунд

    if (diffSecs < freeSecs) {
      // Тегін уақыт
      const remaining = freeSecs - diffSecs;
      const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
      const secs = String(remaining % 60).padStart(2, '0');
      
      document.getElementById("waitTimer").textContent = `${mins}:${secs}`;
      document.getElementById("waitDesc").textContent = "5 минут тегін күту уақыты.";
      document.getElementById("waitTimerBox").classList.add("free");
      document.getElementById("waitFeeText").style.display = "none";
    } else {
      // Ақылы уақыт
      const paidSecs = diffSecs - freeSecs;
      const paidMins = Math.floor(paidSecs / 60) + 1; // 1 минуттан бастап есептеледі
      const fee = paidMins * 10; // Әр минут 10 теңге
      
      const displayMins = String(Math.floor(paidSecs / 60)).padStart(2, '0');
      const displaySecs = String(paidSecs % 60).padStart(2, '0');

      document.getElementById("waitTimer").textContent = `${displayMins}:${displaySecs}`;
      document.getElementById("waitDesc").textContent = "Тегін уақыт бітті. Әр минут 10 ₸.";
      document.getElementById("waitTimerBox").classList.remove("free");
      document.getElementById("waitTimerBox").style.borderColor = "#e54848";
      document.getElementById("waitFeeText").style.display = "block";
      document.getElementById("waitFeeText").textContent = `Күту ақысы: ${fee} ₸`;
    }
  }, 1000);
}

async function loadLocation() {
  try {
    const r = await fetch("/api/passenger?action=location", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, trackingToken: token })
    });
    const d = await r.json();
    if (!d.success || !d.driverLocation) return;

    const pt = [Number(d.driverLocation.latitude), Number(d.driverLocation.longitude)];
    if (!driverMarker) {
      driverMarker = L.marker(pt, {icon: L.divIcon({html: '<div style="font-size:32px">🚕</div>', iconSize: [32,32], iconAnchor: [16,16]})}).addTo(map);
    } else {
      driverMarker.setLatLng(pt);
    }
    map.setView(pt, 16);
    document.getElementById("updated").textContent = "🔄 Соңғы жаңарту: " + new Date().toLocaleTimeString("kk-KZ");
  } catch (e) {}
}

async function cancelOrder() {
  if (!confirm("Сапардан бас тартасыз ба? (Егер күту уақыты өтсе, ақы алынуы мүмкін)")) return;
  try {
    await fetch("/api/passenger?action=cancel", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, trackingToken: token })
    });
    alert("Тапсырыс тоқтатылды");
    window.location.href = "/index.html";
  } catch (e) { alert("Қате"); }
}

initMap();
checkStatus();
pollTimer = setInterval(checkStatus, 5000);
</script>
</body>
</html>
