<!-- Бұл кодты passenger-tracking.html ішіне <head> бөлігіне қосыңыз -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Бұны <body> ішіне қосыңыз -->
<div id="map" style="height: 400px; width: 100%; border-radius: 10px;"></div>
<p id="driver-status" class="text-center mt-2">Жүргізуші іздестірілуде...</p>

<script>
    // Үржар ауданының шамамен координаттары (өз қалаңызға қарай өзгертіңіз)
    const map = L.map('map').setView([47.0903, 81.6212], 14); 

    // Картаның дизайны (OpenStreetMap тегін)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let driverMarker = null;

    // Бұл функцияны API-ден жүргізушінің координаттарын алғанда шақырасыз
    function updateDriverLocation(lat, lng) {
        if (driverMarker) {
            driverMarker.setLatLng([lat, lng]); // Маркерді жылжыту
        } else {
            // Жаңа маркер құру
            driverMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup('Сіздің жүргізушіңіз').openPopup();
        }
    }

    // Серверден мәртебені тексеру (әр 5 секунд сайын)
    setInterval(async () => {
        try {
            const res = await fetch('/api/order?action=get_status'); // Бұл жерде өз API-іңіздің логикасы
            const data = await res.json();
            
            if (data.status) {
                document.getElementById('driver-status').innerText = "Мәртебе: " + data.status;
            }
            if (data.driverLat && data.driverLng) {
                updateDriverLocation(data.driverLat, data.driverLng);
            }
        } catch (error) {
            console.error("Қате:", error);
        }
    }, 5000);
</script>
