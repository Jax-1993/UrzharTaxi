<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ҮРЖАР TAXI — Бақылау</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 0; background: #101522; color: #fff; font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden; }

/* КАРТА ТОЛЫҚ ЭКРАНДА */
#map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

/* ҚАЛҚЫМАЛЫ ПАНЕЛЬДЕР (FLOATING UI) */
.floating-panel {
    position: absolute; left: 15px; right: 15px; z-index: 10;
    background: rgba(28, 37, 54, 0.95); /* Қара-көк мөлдір фон */
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 16px; border: 1px solid #2e3a52;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    padding: 15px;
}

/* ЖОҒАРҒЫ ПАНЕЛЬ */
.top-panel { top: 20px; }
.top-panel h2 { margin: 0 0 10px; font-size: 16px; color: #ffcc00; text-align: center; }
.status { padding: 12px; background: #243045; border-radius: 9px; line-height: 1.5; font-weight: 600; text-align: center; font-size: 15px; }
.status.searching { color: #ffcc00; }
.status.accepted { color: #19d995; }
.status.in_progress { color: #60a5fa; }

/* ТӨМЕНГІ ПАНЕЛЬ */
.bottom-panel { bottom: 20px; padding-bottom: 25px; /* iPhone үшін төменгі саф */ }

/* КҮТУ ТАЙМЕРІ */
.wait-timer-box {
  background: linear-gradient(135deg, #1a3d30 0%, #1d493d 100%);
  border: 2px solid #16bd79; border-radius: 14px; padding: 15px; margin-bottom: 15px; text-align: center; display: none;
}
.wait-timer-box.paid { background: linear-gradient(135deg, #2a1a1a 0%, #3a1f1f 100%); border-color: #e54848; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
.wait-title { font-size: 14px; font-weight: 800; margin-bottom: 5px; }
.wait-timer { font-size: 32px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; margin: 5px 0; }
.wait-desc { font-size: 12px; color: #cbd5e1; line-height: 1.4; }
.wait-fee-text { font-size: 18px; font-weight: 800; color: #ffcc00; margin-top: 8px; display: none; }

/* КҮТУ АҚЫСЫНЫҢ БЕЙДЖІ */
.wait-fee-badge {
  background: linear-gradient(135deg, #3a2800 0%, #4a3300 100%);
  border: 2px solid #ffcc00; border-radius: 12px; padding: 12px; margin-bottom: 15px; text-align: center; display: none;
}
.wait-fee-badge .title { font-size: 13px; color: #ffcc00; margin-bottom: 4px; font-weight: 700; }
.wait-fee-badge .amount { font-size: 24px; font-weight: 900; color: #fff; }
.wait-fee-badge .note { font-size: 11px; color: #94a3b8; margin-top: 4px; }

/* БАТЫРМАЛАР */
button { width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 10px; transition: opacity 0.2s; }
button:active { opacity: 0.8; }
.btn-cancel { background: #e54848; color: white; margin-top: 0; }
.btn-home { background: #2d3a52; color: white; }

/* БАҒАЛАУ МОДАЛЬДІ ТЕРЕЗЕСІ */
.rating-modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.85); display: none;
  justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px);
}
.rating-modal {
  background: #1c2536; padding: 25px 20px; border-radius: 20px; width: 90%; max-width: 400px;
  text-align: center; border: 1px solid #2e3a52; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideUp 0.3s ease-out;
}
@keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.rating-modal h3 { margin: 0 0 8px; color: #fff; font-size: 22px; font-weight: 800; }
.rating-modal p { color:#c5cede; font-size:14px; margin-bottom:20px; }
.rating-stars { display: flex; justify-content: center; gap: 10px; margin: 20px 0 25px; }
.star { font-size: 45px; color: #4a5568; cursor: pointer; transition: color 0.2s, transform 0.2s; user-select: none; line-height: 1; }
.star:hover, .star.active { color: #ffd400; transform: scale(1.15); }
.rating-review { width: 100%; padding: 12px; border-radius: 10px; background: #101522; border: 1px solid #2e3a52; color: #fff; font-family: inherit; font-size: 14px; resize: none; margin-bottom: 15px; outline: none; }
.rating-review:focus { border-color: #ffd400; }
.btn-submit-rating { background: #ffd400; color: #111; font-weight: 900; }
.btn-submit-rating:disabled { background: #4a5568; color: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>

<!-- КАРТА -->
<div id="map"></div>

<!-- ЖОҒАРҒЫ ҚАЛҚЫМАЛЫ ПАНЕЛЬ -->
<div class="floating-panel top-panel">
  <h2>📍 Жүргізушіні бақылау</h2>
  <div id="status" class="status searching">Жүйеге қосылуда...</div>
</div>

<!-- ТӨМЕНГІ ҚАЛҚЫМАЛЫ ПАНЕЛЬ -->
<div class="floating-panel bottom-panel" id="bottomPanel">
  
  <!-- КҮТУ ТАЙМЕРІ -->
  <div id="waitTimerBox" class="wait-timer-box">
    <div class="wait-title">🚕 Жүргізуші келді!</div>
    <div class="wait-timer" id="waitTimer">05:00</div>
    <div class="wait-desc" id="waitDesc">5 минут тегін күту уақыты.</div>
    <div class="wait-fee-text" id="waitFeeText">Күту ақысы: 0 ₸</div>
  </div>

  <!-- КҮТУ АҚЫСЫНЫҢ НӘТИЖЕСІ -->
  <div id="waitFeeBadge" class="wait-fee-badge">
    <div class="title">💰 Күту ақысы</div>
    <div class="amount" id="waitFeeAmount">0 ₸</div>
    <div class="note" id="waitFeeNote">Сапар құнына қосылды</div>
  </div>

  <button class="btn-cancel" id="btnCancelOrder" onclick="cancelOrder()">❌ САПАРДАН БАС ТАРТУ</button>
  <button class="btn-home" onclick="window.location.href='/index.html'">🏠 Басты бетке</button>
</div>

<!-- БАҒАЛАУ ТЕРЕЗЕСІ -->
<div id="ratingModal" class="rating-modal-overlay">
  <div class="rating-modal">
    <h3 id="ratingTitle">Сапар аяқталды!</h3>
    <p id="ratingSubtitle">Жүргізушіні бағалаңыз</p>
    <div class="rating-stars" id="starContainer">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>
    <textarea id="ratingReview" class="rating-review" rows="3" placeholder="Пікіріңіз (міндетті емес)"></textarea>
    <button id="btnSubmitRating" class="btn-submit-rating" onclick="submitRating()" disabled>Жіберу</button>
  </div>
</div>

<!-- 2GIS MapGL скриптін қосу -->
<script src="https://mapgl.2gis.com/api/js/v1"></script>
<script>
// 🚨 ОСЫ ЖЕРГЕ ӨЗ 2GIS API КІЛТІҢІЗДІ ҚОЯСЫЗ 🚨
const DG_API_KEY = '348a23e4-d087-41b8-9262-f9848e3571e7';

const orderId = sessionStorage.getItem("urzhar_taxi_order_id");
const token = sessionStorage.getItem("urzhar_taxi_tracking_token");
let map, driverMarker, pickupMarker, destinationMarker, routeLine;
let pollTimer;
let waitInterval = null;
let arrivedTime = null;
let notificationPlayed = false;
let rideStartedAnnounced = false;
let selectedRating = 0;
let currentOrderStatus = "searching";
let orderCoords = { pickup: null, destination: null };

// Дыбыс пен вибрация (Жүргізуші келгенде)
function notifyArrival() {
  if (notificationPlayed) return;
  notificationPlayed = true;
  try {
    if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctx = new AudioCtx();
      const now = ctx.currentTime;
      for (let i = 0; i < 2; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880; osc.connect(gain); gain.connect(ctx.destination);
        const start = now + i * 0.4;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(0.8, start + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, start + 0.3);
        osc.start(start); osc.stop(start + 0.3);
      }
    }
  } catch (e) {}
}

// 🎤 Дауыстап хабарлау функциясы (Сапар басталғанда)
function speakRideStarted() {
  if (rideStartedAnnounced) return;
  rideStartedAnnounced = true;
  try {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const text = "Сапар басталды. Белдіктеріңізді тағып отырыңыздар.";
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'kk-KZ'; utterance.rate = 0.9; utterance.pitch = 1; utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }
  } catch (e) {}
}

// === 2GIS КАРТАСЫН ІСКЕ ҚОСУ ===
function initMap() {
  const savedLat = localStorage.getItem('passenger_last_lat');
  const savedLng = localStorage.getItem('passenger_last_lng');
  const initialCoords = (savedLat && savedLng) ? [Number(savedLng), Number(savedLat)] : [66.9237, 48.0196];
  const initialZoom = (savedLat && savedLng) ? 15 : 12;

  map = new mapgl.Map("map", {
      center: initialCoords,
      zoom: initialZoom,
      key: DG_API_KEY
  });
}

async function checkStatus() {
  if (!orderId || !token) {
    document.getElementById("status").textContent = "Тапсырыс табылмады. Басты бетке оралыңыз.";
    document.getElementById("btnCancelOrder").style.display = "none";
    return;
  }
  
  try {
    const r = await fetch("/api/passenger?action=status", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, trackingToken: token })
    });
    const d = await r.json();
    if (!d.success) return;

    currentOrderStatus = d.order.status;
    const st = document.getElementById("status");
    const timerBox = document.getElementById("waitTimerBox");
    const feeBadge = document.getElementById("waitFeeBadge");

    // Координаталарды алу (2GIS үшін [Lng, Lat])
    if (d.order.pickup_latitude && !orderCoords.pickup) {
      orderCoords.pickup = [Number(d.order.pickup_longitude), Number(d.order.pickup_latitude)];
      pickupMarker = new mapgl.HtmlMarker(map, {
          coordinates: orderCoords.pickup,
          html: '<div style="font-size:32px;filter:drop-shadow(0 3px 3px rgba(0,0,0,0.5))">📍</div>',
          anchor: [0.5, 1]
      });
      map.setCenter(orderCoords.pickup);
    }
    if (d.order.destination_latitude && !orderCoords.destination) {
      orderCoords.destination = [Number(d.order.destination_longitude), Number(d.order.destination_latitude)];
      destinationMarker = new mapgl.HtmlMarker(map, {
          coordinates: orderCoords.destination,
          html: '<div style="font-size:32px;filter:drop-shadow(0 3px 3px rgba(0,0,0,0.5))">🏁</div>',
          anchor: [0.5, 1]
      });
    }

    // Жүргізуші келгенін тексеру
    if (d.order.driver_arrived_at && !arrivedTime && d.order.status === 'accepted') {
      arrivedTime = new Date(d.order.driver_arrived_at).getTime();
      startWaitTimer(d.order);
      notifyArrival();
    }

    if (d.order.status === "searching") {
      st.className = "status searching";
      st.innerHTML = "🔍 Жүргізуші ізделуде...";
      timerBox.style.display = "none";
      feeBadge.style.display = "none";
      if (routeLine) { routeLine.destroy(); routeLine = null; }
      
    } else if (d.order.status === "accepted") {
      st.className = "status accepted";
      if (d.order.driver_arrived_at) {
        st.innerHTML = "🚕 Жүргізуші келді! Күтудеміз...";
        timerBox.style.display = "block";
      } else {
        st.innerHTML = "✅ Жүргізуші тағайындалды! Келе жатыр...";
        timerBox.style.display = "none";
      }
      loadLocation();
      
    } else if (d.order.status === "in_progress") {
      st.className = "status in_progress";
      st.innerHTML = "🚕 Сапар басталды!";
      speakRideStarted();
      timerBox.style.display = "none";
      if (waitInterval) clearInterval(waitInterval);
      
      const wf = Number(d.order.waiting_fee || 0);
      const wm = Number(d.order.waiting_minutes || 0);
      if (wf > 0) {
        feeBadge.style.display = "block";
        document.getElementById("waitFeeAmount").textContent = `${wf} ₸`;
        document.getElementById("waitFeeNote").textContent = `(${wm} мин ақылы күту — сапар құнына қосылды)`;
      }
      loadLocation();
      
    } else if (d.order.status === "completed") {
      st.className = "status accepted";
      const wf = Number(d.order.waiting_fee || 0);
      st.innerHTML = "🏁 Сапар аяқталды. Рахмет!";
      if (wf > 0) {
        st.innerHTML += `<br><span style="color:#ffcc00;font-size:13px;margin-top:6px;display:inline-block">💰 Күту ақысы: ${wf} ₸ қосылды</span>`;
      }
      
      document.getElementById("bottomPanel").style.display = "none"; // Батырмаларды жасыру
      timerBox.style.display = "none";
      if (waitInterval) clearInterval(waitInterval);
      clearInterval(pollTimer);
      if (routeLine) routeLine.destroy(); // Маршрутты өшіру

      if (!d.order.rating && sessionStorage.getItem('rated_' + orderId) !== 'true') {
        document.getElementById("ratingModal").style.display = "flex";
      }
      
    } else if (d.order.status === "cancelled") {
      st.className = "status searching";
      st.innerHTML = "❌ Тапсырыс тоқтатылды";
      document.getElementById("bottomPanel").style.display = "none";
      timerBox.style.display = "none";
      if (waitInterval) clearInterval(waitInterval);
      clearInterval(pollTimer);
    }
  } catch (e) {
    console.error("Status API қатесі:", e);
  }
}

// 🚕 ЖҮРГІЗУШІНІҢ ОРНЫН АЛУ ЖӘНЕ МАРШРУТ СЫЗУ
async function loadLocation() {
  try {
    const r = await fetch("/api/passenger?action=location", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, trackingToken: token })
    });
    const d = await r.json();
    
    if (!d.success || !d.driverLocation) return;

    const driverPos = [Number(d.driverLocation.longitude), Number(d.driverLocation.latitude)];
    
    if (!driverMarker) {
      driverMarker = new mapgl.HtmlMarker(map, {
          coordinates: driverPos,
          html: '<div style="font-size:38px;filter:drop-shadow(0 4px 4px rgba(0,0,0,0.6))">🚕</div>',
          anchor: [0.5, 0.5]
      });
    } else {
      driverMarker.setCoordinates(driverPos);
    }

    drawRoute(driverPos);

  } catch (e) {
    console.error("Location API қатесі:", e);
  }
}

// 🗺️ OSRM КӨМЕГІМЕН ЖОЛ СЫЗУ
async function drawRoute(driverPos) {
  let start = null;
  let end = null;

  // Егер сапар басталса, маршрут: Алу нүктесінен -> Бару нүктесіне
  if (currentOrderStatus === 'accepted' && orderCoords.pickup) {
    start = driverPos;
    end = orderCoords.pickup;
  } else if (currentOrderStatus === 'in_progress' && orderCoords.destination) {
    start = orderCoords.pickup || driverPos;
    end = orderCoords.destination;
  }

  if (!start || !end) return;

  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`);
    const data = await res.json();

    if (data.code === 'Ok' && data.routes.length > 0) {
      if (routeLine) routeLine.destroy();
      
      routeLine = new mapgl.Polyline(map, {
          coordinates: data.routes[0].geometry.coordinates,
          width: 7,
          color: '#60a5fa', // Яндекс стиліндегі көк маршрут
          opacity: 0.9
      });

      // Картаны панельдерге кедергі жасамайтындай етіп ыңғайлау (Padding)
      const coords = data.routes[0].geometry.coordinates;
      const lats = coords.map(c => c[1]);
      const lngs = coords.map(c => c[0]);
      
      map.fitBounds({
          southWest: [Math.min(...lngs), Math.min(...lats)],
          northEast: [Math.max(...lngs), Math.max(...lats)],
          padding: { top: 160, bottom: 250, left: 50, right: 50 } // Жоғарғы және төменгі панельдер үшін
      });
    }
  } catch (e) {
    console.error("Маршрутты сызу қатесі:", e);
  }
}

function startWaitTimer(order) {
  const timerBox = document.getElementById("waitTimerBox");
  const timerEl = document.getElementById("waitTimer");
  const descEl = document.getElementById("waitDesc");
  const feeText = document.getElementById("waitFeeText");
  
  timerBox.style.display = "block";
  if (waitInterval) clearInterval(waitInterval);

  const FREE_SECS = 5 * 60;
  const RATE = 10;

  let freeUntilMs = arrivedTime + (FREE_SECS * 1000);
  if (order.waiting && order.waiting.freeUntil) {
      freeUntilMs = new Date(order.waiting.freeUntil).getTime();
  }

  const tick = () => {
    const now = Date.now();
    if (now < freeUntilMs) {
      const remaining = Math.floor((freeUntilMs - now) / 1000);
      const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
      const secs = String(remaining % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
      descEl.textContent = "5 минут тегін күту уақыты.";
      timerBox.classList.remove("paid");
      feeText.style.display = "none";
    } else {
      const paidSecs = Math.floor((now - freeUntilMs) / 1000);
      const paidMins = Math.floor(paidSecs / 60);
      const fee = paidMins * RATE;
      const displayMins = String(Math.floor(paidSecs / 60)).padStart(2, '0');
      const displaySecs = String(paidSecs % 60).padStart(2, '0');
      timerEl.textContent = `${displayMins}:${displaySecs}`;
      descEl.textContent = "Тегін уақыт бітті. Әр минут 10 ₸.";
      timerBox.classList.add("paid");
      feeText.style.display = "block";
      feeText.textContent = `Күту ақысы: ${fee} ₸ (${paidMins} мин)`;
    }
  };
  tick();
  waitInterval = setInterval(tick, 1000);
}

async function cancelOrder() {
  if (!confirm("Сапардан бас тартасыз ба? (Егер күту уақыты өтсе, ақы алынуы мүмкін)")) return;
  try {
    await fetch("/api/passenger?action=cancel", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, trackingToken: token })
    });
    sessionStorage.removeItem("urzhar_taxi_order_id");
    alert("Тапсырыс тоқтатылды");
    window.location.href = "/index.html";
  } catch (e) { alert("Қате"); }
}

// ==========================================
// БАҒАЛАУ ЖҮЙЕСІНІҢ ЛОГИКАСЫ
// ==========================================
const stars = document.querySelectorAll('.star');
const btnSubmit = document.getElementById('btnSubmitRating');

stars.forEach(star => {
  star.addEventListener('click', () => {
    selectedRating = parseInt(star.getAttribute('data-value'));
    updateStars(selectedRating);
    btnSubmit.disabled = false;
  });
});

function updateStars(rating) {
  stars.forEach(s => {
    if (parseInt(s.getAttribute('data-value')) <= rating) {
      s.classList.add('active');
    } else {
      s.classList.remove('active');
    }
  });
}

async function submitRating() {
  if (selectedRating === 0) return;
  
  btnSubmit.disabled = true;
  btnSubmit.textContent = "Жіберілуде...";
  const review = document.getElementById('ratingReview').value.trim();

  try {
    const r = await fetch("/api/order", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, rating: selectedRating, review, trackingToken: token })
    });
    
    const d = await r.json();

    if (r.ok && d.success) {
      document.getElementById('ratingTitle').textContent = "Рахмет!";
      document.getElementById('ratingSubtitle').textContent = "Пікіріңіз біз үшін маңызды.";
      document.getElementById('starContainer').style.display = 'none';
      document.getElementById('ratingReview').style.display = 'none';
      
      btnSubmit.textContent = "Жабу";
      btnSubmit.disabled = false;
      
      btnSubmit.onclick = () => {
        document.getElementById('ratingModal').style.display = 'none';
        sessionStorage.setItem('rated_' + orderId, 'true');
        sessionStorage.removeItem("urzhar_taxi_order_id"); // Тапсырысты тазалау
        window.location.href = '/index.html';
      };
    } else {
      alert(d.error || "Қате орын алды, қайталап көріңіз.");
      btnSubmit.disabled = false;
      btnSubmit.textContent = "Жіберу";
    }
  } catch (e) {
    alert("Желі қатесі. Интернетті тексеріңіз.");
    btnSubmit.disabled = false;
    btnSubmit.textContent = "Жіберу";
  }
}

// Іске қосу
initMap();
checkStatus();
pollTimer = setInterval(checkStatus, 5000);
</script>
