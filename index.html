<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urzhar Taxi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#172033}
header{background:#123c2b;color:white;text-align:center;padding:25px}
main{max-width:450px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
button{background:#16834f;color:white;border:0;font-weight:bold}
#result{padding:10px;margin-top:10px}
</style>
</head>
<body>

<header>
<h1>🚕 Urzhar Taxi</h1>
<p>Ұржар және Мақаншы аудандары</p>
</header>

<main>
<div class="card">
<h2>Такси шақыру</h2>

<form id="orderForm">
<input id="name" placeholder="Аты-жөніңіз" required>
<input id="phone" type="tel" placeholder="Телефон нөміріңіз" required>
<input id="from" placeholder="Қай ауылдан?" required>
<input id="to" placeholder="Қай ауылға?" required>

<button type="submit">Тапсырыс беру</button>
</form>

<div id="result"></div>
</div>
</main>

<script>
const SUPABASE_URL = "https://hjjxizifomgogpimvlnv.supabase.co";
const SUPABASE_KEY = "PUBLISHABLE_KEY_ОСЫ_ЖЕРГЕ";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("orderForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const result = document.getElementById("result");
  result.textContent = "Тапсырыс жіберілуде...";

  const order = {
    passenger_name: document.getElementById("name").value.trim(),
    passenger_phone: document.getElementById("phone").value.trim(),
    pickup_village: document.getElementById("from").value.trim(),
    destination_village: document.getElementById("to").value.trim()
  };

  const { error } = await db.from("taxi_orders").insert(order);

  if (error) {
    result.textContent = "Қате: " + error.message;
  } else {
    result.textContent = "Тапсырысыңыз қабылданды!";
    document.getElementById("orderForm").reset();
  }
});
</script>

</body>
</html>
