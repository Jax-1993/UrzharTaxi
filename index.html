<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urzhar Taxi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #123c2b;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 30px; }
    header p { margin-bottom: 0; }
    main {
      max-width: 480px;
      margin: 25px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5d0;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #16834f;
      color: white;
      border: 0;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
    }
    #result {
      margin-top: 18px;
      padding: 13px;
      background: #e8f5ed;
      border-radius: 9px;
      display: none;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #667085;
    }
  </style>
</head>
<body>

<header>
  <h1>🚕 Urzhar Taxi</h1>
  <p>Ұржар және Мақаншы аудандары</p>
</header>

<main>
  <div class="card">
    <h2>Жолға тапсырыс беру</h2>

    <label for="from">Қай жерден?</label>
    <input id="from" placeholder="Мысалы: Ұржар">

    <label for="to">Қай жерге?</label>
    <input id="to" placeholder="Мысалы: Мақаншы">

    <label for="distance">Қашықтық (км)</label>
    <input id="distance" type="number" min="1" placeholder="Қашықтықты енгізіңіз">

    <button onclick="calculate()">Жолақыны есептеу</button>

    <div id="result"></div>
  </div>
</main>

<footer>
  © 2026 Urzhar Taxi
</footer>

<script>
  // Нақты тарифтерді кейін әкімші панелінен баптаймыз.
  const MIN_FARE = 0;
  const PRICE_PER_KM = 0;

  function calculate() {
    const from = document.getElementById("from").value.trim();
    const to = document.getElementById("to").value.trim();
    const distance = Number(document.getElementById("distance").value);
    const result = document.getElementById("result");

    if (!from || !to || !Number.isFinite(distance) || distance <= 0) {
      result.style.display = "block";
      result.textContent = "Барлық жолақтарды дұрыс толтырыңыз.";
      return;
    }

    if (PRICE_PER_KM <= 0) {
      result.style.display = "block";
      result.textContent =
        "Маршрут қабылданды. Жолақы тарифі әлі бапталған жоқ.";
      return;
    }

    const fare = Math.max(MIN_FARE, distance * PRICE_PER_KM);

    result.style.display = "block";
    result.textContent =
      `Бағыт: ${from} → ${to}. Болжамды жолақы: ${fare.toLocaleString("kk-KZ")} ₸`;
  }
</script>

</body>
</html>
