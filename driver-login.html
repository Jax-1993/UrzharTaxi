
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ҮРЖАР TAXI — Жүргізуші кіруі</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
.box {
  max-width: 420px;
  margin: 70px auto;
  padding: 25px;
  background: #1d293b;
  border-radius: 18px;
}
h2 { text-align: center; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}
button {
  background: #16a34a;
  color: white;
  font-weight: bold;
}
#message {
  margin-top: 15px;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="box">
  <h2>🚕 ҮРЖАР TAXI</h2>
  <h3>Жүргізуші кабинеті</h3>

  <form id="loginForm">
    <input
      id="phone"
      type="tel"
      placeholder="Телефон нөмірі"
      required
    >
    <input
      id="password"
      type="password"
      placeholder="Уақытша құпиясөз"
      required
    >
    <button type="submit">Жүйеге кіру</button>
  </form>

  <div id="message"></div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = document.getElementById("message");
  const button = e.target.querySelector("button");

  button.disabled = true;
  message.textContent = "Тексерілуде...";

  try {
    const response = await fetch("/api/driver-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      body: JSON.stringify({
        phone: document.getElementById("phone").value.trim(),
        password: document.getElementById("password").value
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      message.textContent = result.message || "Кіру мүмкін болмады";
      return;
    }

    message.textContent = "Сәтті кірдіңіз!";

    window.location.href = "/driver.html";

  } catch (error) {
    message.textContent = "Байланыс қатесі. Қайталап көріңіз.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
