<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ҮРЖАР TAXI — Жүргізуші кіруі</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

.box {
  max-width: 420px;
  margin: 70px auto;
  padding: 25px;
  background: #1d293b;
  border-radius: 18px;
}

h2, h3 { text-align: center; }

input, button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}

.password-box {
  position: relative;
  margin-top: 15px;
}

.password-box input {
  margin-top: 0;
  padding-right: 55px;
}

.toggle-password {
  position: absolute;
  right: 5px;
  top: 5px;
  width: 45px;
  height: 45px;
  margin: 0;
  padding: 0;
  background: transparent;
  color: #263449;
  font-size: 23px;
  cursor: pointer;
}

button[type="submit"] {
  background: #16a34a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

#message {
  margin-top: 15px;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="box">
  <h2>🚕 ҮРЖАР TAXI</h2>
  <h3>Жүргізуші кабинеті</h3>

  <form id="loginForm">
    <input
      id="phone"
      type="tel"
      placeholder="Телефон нөмірі"
      required
    >

    <div class="password-box">
      <input
        id="password"
        type="password"
        placeholder="Уақытша құпиясөз"
        required
      >

      <button
        type="button"
        class="toggle-password"
        id="togglePassword"
        aria-label="Парольді көрсету"
        aria-pressed="false"
      >👁️</button>
    </div>

    <button type="submit">Жүйеге кіру</button>
  </form>

  <div id="message"></div>
</div>

<script>
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {
  const isHidden = passwordInput.type === "password";

  passwordInput.type = isHidden ? "text" : "password";
  togglePassword.textContent = isHidden ? "🙈" : "👁️";
  togglePassword.setAttribute("aria-pressed", String(isHidden));
  togglePassword.setAttribute(
    "aria-label",
    isHidden ? "Парольді жасыру" : "Парольді көрсету"
  );
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = document.getElementById("message");
  const button = e.target.querySelector('button[type="submit"]');

  button.disabled = true;
  message.textContent = "Тексерілуде...";

  try {
    const response = await fetch("/api/driver-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      body: JSON.stringify({
        phone: document.getElementById("phone").value.trim(),
        password: passwordInput.value
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      message.textContent = result.message || "Кіру мүмкін болмады";
      return;
    }

    message.textContent = "Сәтті кірдіңіз!";
    window.location.href = "/driver.html";

  } catch (error) {
    message.textContent = "Байланыс қатесі. Қайталап көріңіз.";
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
