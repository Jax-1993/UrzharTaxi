<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ҮРЖАР TAXI — Жүргізуші кіруі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --yellow:#ffcc00;--green:#16bd79;--red:#e34b59;
  --black:#101114;--gray-bg:#101522;--card:#1c2536;
  --card-light:#243045;--border:#2e3a52;--text-muted:#94a3b8;
}
body{
  margin:0;background:var(--gray-bg);color:#fff;
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,204,0,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(22,189,121,0.05) 0%, transparent 50%);
}

/* ===== LOGIN BOX ===== */
.login-box{
  width:100%;max-width:420px;
  background:var(--card);border-radius:22px;
  padding:32px 24px;
  border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  animation:fadeIn 0.4s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ===== HEADER ===== */
.login-header{text-align:center;margin-bottom:28px}
.brand-icon{
  font-size:56px;display:block;margin-bottom:10px;
  filter:drop-shadow(0 4px 12px rgba(255,204,0,0.3));
}
.login-header h1{
  margin:0;color:var(--yellow);
  font-size:24px;font-weight:900;letter-spacing:-0.5px;
}
.login-header h2{
  margin:6px 0 0;color:#fff;
  font-size:15px;font-weight:600;
  opacity:0.85;
}
.login-header p{
  margin:10px 0 0;color:var(--text-muted);
  font-size:13px;line-height:1.5;
}

/* ===== FORM ===== */
.form-group{margin-bottom:14px}
.form-label{
  display:block;color:var(--text-muted);
  font-size:12px;font-weight:600;
  letter-spacing:0.3px;
  margin-bottom:6px;text-transform:uppercase;
}
input{
  width:100%;padding:15px;
  background:#111a2a;color:white;
  border:1.5px solid var(--border);border-radius:12px;
  font-size:15px;font-family:inherit;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
}
input:focus{
  border-color:var(--yellow);
  box-shadow:0 0 0 3px rgba(255,204,0,0.12);
  background:#0d1626;
}
input::placeholder{color:#5a6d85}

/* ===== PASSWORD FIELD ===== */
.password-wrap{position:relative}
.password-wrap input{padding-right:58px}
.toggle-pass{
  position:absolute;right:6px;top:50%;
  transform:translateY(-50%);
  width:46px;height:44px;
  background:transparent;color:#94a3b8;
  border:0;border-radius:10px;
  font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.2s,color 0.2s;
}
.toggle-pass:hover{background:rgba(255,255,255,0.05);color:#fff}
.toggle-pass:active{transform:translateY(-50%) scale(0.95)}

/* ===== BUTTON ===== */
.submit-btn{
  width:100%;padding:16px;border:0;
  background:linear-gradient(135deg,#ffcc00 0%,#ffdb4d 100%);
  color:#111;font-weight:900;font-size:15px;
  border-radius:13px;cursor:pointer;
  font-family:inherit;letter-spacing:0.3px;
  box-shadow:0 6px 20px rgba(255,204,0,0.35);
  transition:transform 0.15s,box-shadow 0.2s;
  margin-top:6px;
}
.submit-btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 8px 26px rgba(255,204,0,0.45);
}
.submit-btn:active:not(:disabled){transform:translateY(0)}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed}

/* ===== MESSAGES ===== */
.msg{
  margin-top:16px;padding:13px 15px;
  border-radius:11px;font-size:13px;
  line-height:1.5;font-weight:500;
  display:none;animation:fadeIn 0.3s ease;
  text-align:center;
}
.msg.show{display:block}
.msg.error{
  background:rgba(227,75,89,0.1);
  border:1px solid rgba(227,75,89,0.3);
  color:#f05a68;
}
.msg.success{
  background:rgba(22,189,121,0.1);
  border:1px solid rgba(22,189,121,0.3);
  color:#19d995;
}
.msg.info{
  background:rgba(255,204,0,0.08);
  border:1px solid rgba(255,204,0,0.2);
  color:#ffdb4d;
}

/* ===== BLOCKED PANEL ===== */
.blocked-panel{
  display:none;
  background:linear-gradient(135deg,#2a1a1a 0%,#3a1f1f 100%);
  border:2px solid var(--red);border-radius:16px;
  padding:24px;margin-top:20px;
  text-align:center;animation:fadeIn 0.3s ease;
}
.blocked-panel.show{display:block}
.blocked-icon{font-size:44px;margin-bottom:12px;display:block}
.blocked-panel h3{
  color:var(--red);margin:0 0 10px;
  font-size:17px;font-weight:900;
}
.blocked-panel p{
  color:#cbd5e1;font-size:13px;
  line-height:1.6;margin:6px 0;
}
.blocked-reason{
  background:rgba(0,0,0,0.3);padding:12px;
  border-radius:9px;margin-top:12px;
  font-size:13px;color:#ffb3b8;
  font-style:italic;line-height:1.5;
}

/* ===== FOOTER LINK ===== */
.footer-link{
  text-align:center;margin-top:20px;
  font-size:13px;color:var(--text-muted);
}
.footer-link a{
  color:var(--yellow);text-decoration:none;
  font-weight:700;transition:opacity 0.2s;
}
.footer-link a:hover{opacity:0.8}

/* ===== SPINNER ===== */
.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(0,0,0,0.2);
  border-top-color:#111;border-radius:50%;
  animation:spin 0.7s linear infinite;
  margin-right:8px;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .login-box{padding:26px 20px}
  .login-header h1{font-size:21px}
  .brand-icon{font-size:48px}
}
</style>
</head>
<body>

<div class="login-box">

  <div class="login-header">
    <span class="brand-icon">🚕</span>
    <h1>ҮРЖАР TAXI</h1>
    <h2>Жүргізуші кабинеті</h2>
    <p>Жүйеге кіру үшін телефон мен құпиясөзді енгізіңіз</p>
  </div>

  <form id="loginForm" autocomplete="on">

    <div class="form-group">
      <label class="form-label" for="phone">📞 Телефон нөмірі</label>
      <input
        id="phone"
        type="tel"
        placeholder="+7 777 123 45 67"
        autocomplete="tel"
        inputmode="tel"
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="password">🔒 Құпиясөз</label>
      <div class="password-wrap">
        <input
          id="password"
          type="password"
          placeholder="Уақытша құпиясөз"
          autocomplete="current-password"
          required
        >
        <button
          type="button"
          class="toggle-pass"
          id="togglePassword"
          aria-label="Құпиясөзді көрсету"
        >👁️</button>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      ЖҮЙЕГЕ КІРУ
    </button>

    <div id="message" class="msg"></div>

  </form>

  <!-- БҰҒАТТАЛҒАН ПАНЕЛЬ -->
  <div class="blocked-panel" id="blockedPanel">
    <span class="blocked-icon">🚫</span>
    <h3>Аккаунтыңыз бұғатталған</h3>
    <p>Жүйеге кіру мүмкін емес.</p>
    <div class="blocked-reason" id="blockedReason">Себебі көрсетілмеген</div>
    <p style="margin-top:14px;font-size:12px">
      Толық ақпарат алу үшін әкімшіге хабарласыңыз.
    </p>
  </div>

  <div class="footer-link">
    <a href="/index.html">← Басты бетке оралу</a>
  </div>

</div>

<script>
const phoneInput = document.getElementById("phone");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const blockedPanel = document.getElementById("blockedPanel");
const blockedReason = document.getElementById("blockedReason");
const loginForm = document.getElementById("loginForm");

// ===== PHONE FORMATTING (auto-format: +7 777 123 45 67) =====
phoneInput.addEventListener("input", (e) => {
  let value = e.target.value.replace(/\D/g, "");
  
  // Егер 8-ден басталса → 7-ге ауыстыру
  if (value.startsWith("8") && value.length > 1) {
    value = "7" + value.slice(1);
  }
  
  // Халықаралық форматты құру
  let formatted = "";
  if (value.length > 0) {
    formatted = "+" + value[0];
    if (value.length > 1) formatted += " " + value.slice(1, 4);
    if (value.length > 4) formatted += " " + value.slice(4, 7);
    if (value.length > 7) formatted += " " + value.slice(7, 9);
    if (value.length > 9) formatted += " " + value.slice(9, 11);
  }
  
  e.target.value = formatted;
});

// ===== TOGGLE PASSWORD =====
togglePassword.addEventListener("click", () => {
  const isHidden = passwordInput.type === "password";
  passwordInput.type = isHidden ? "text" : "password";
  togglePassword.textContent = isHidden ? "🙈" : "👁️";
  togglePassword.setAttribute("aria-label", isHidden ? "Құпиясөзді жасыру" : "Құпиясөзді көрсету");
});

// ===== MESSAGE HELPERS =====
function showMessage(text, type = "info") {
  message.textContent = text;
  message.className = "msg show " + type;
}
function hideMessage() {
  message.className = "msg";
  message.textContent = "";
}
function hideBlocked() {
  blockedPanel.classList.remove("show");
}

// ===== LOGIN =====
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  
  const phone = phoneInput.value.trim();
  const password = passwordInput.value;

  // Валидация
  if (!phone || phone.replace(/\D/g, "").length < 11) {
    showMessage("Телефон нөмірін толық енгізіңіз", "error");
    return;
  }
  if (!password) {
    showMessage("Құпиясөзді енгізіңіз", "error");
    return;
  }

  hideBlocked();
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Тексерілуде...';
  showMessage("Кіру тексерілуде...", "info");

  try {
    const response = await fetch("/api/driver?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ phone, password })
    });

    const result = await response.json();

    // ===== БҰҒАТТАЛҒАН =====
    if (response.status === 403 && result.blocked) {
      hideMessage();
      blockedReason.textContent = result.reason || "Себебі көрсетілмеген";
      blockedPanel.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "ЖҮЙЕГЕ КІРУ";
      return;
    }

    // ===== ҚАТЕ =====
    if (!response.ok || !result.success) {
      showMessage(result.message || "Телефон немесе құпиясөз қате", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "ЖҮЙЕГЕ КІРУ";
      // Пароль өрісін тазалау
      passwordInput.value = "";
      passwordInput.focus();
      return;
    }

    // ===== СӘТТІ =====
    showMessage("✅ Сәтті кірдіңіз! Бағытталуда...", "success");
    submitBtn.innerHTML = '<span class="spinner"></span>Кіру...';

    // 500ms кейін бағыттау
    setTimeout(() => {
      window.location.href = "/driver.html";
    }, 500);

  } catch (error) {
    console.error("Login error:", error);
    showMessage("Сервермен байланыс қатесі. Қайталап көріңіз.", "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "ЖҮЙЕГЕ КІРУ";
  }
});

// ===== AUTO-CHECK: егер cookie бар болса, тікелей driver.html-ге =====
(async function checkExistingSession() {
  try {
    const r = await fetch("/api/driver?action=session", {
      credentials: "include",
      cache: "no-store"
    });
    if (r.ok) {
      const d = await r.json();
      if (d.success && d.driver) {
        // Cookie жарамды — бағыттау
        showMessage("✅ Сессия табылды. Бағытталуда...", "success");
        setTimeout(() => {
          window.location.href = "/driver.html";
        }, 600);
      }
    }
  } catch (e) {
    // Үнсіз өту — қолданушы қолмен кіре алады
  }
})();

// ===== FOCUS PHONE ON LOAD =====
window.addEventListener("DOMContentLoaded", () => {
  if (!phoneInput.value) phoneInput.focus();
});
</script>

</body>
</html>
